ling the Red Sea to protect shipping, but attacks continue. Yemen's government is too weak to stop the Houthis. The crisis shows how a small militant group can disrupt global commerce and demonstrates the fragility of international trade routes. Insurance companies are struggling to cover losses, and some shipping companies are considering abandoning the route entirely.11:T7b0,"])</script><script>self.__next_f.push([1,"## Historical Context\nThe Houthis are a Shia militant group that took control of northern Yemen in 2014-2015. Yemen has been in civil war since 2015, with Saudi Arabia and UAE supporting the government against the Houthis (who are backed by Iran). The Red Sea is one of the world's most important shipping routes—about 12% of global trade passes through it. The Houthis began attacking ships in late 2023, claiming solidarity with Palestinians in Gaza.\n\n## Multiple Perspectives\n**Houthis**: They're attacking ships to pressure countries to stop supporting Israel and to end the Gaza conflict. They claim they're defending Palestinians.\n**US/Western navies**: The attacks are piracy and terrorism that disrupt global commerce. Must be stopped militarily.\n**Shipping industry**: The attacks are economically devastating. Routes must be protected or alternative routes must be used.\n**Iran**: Denies directly controlling Houthis but benefits from disruption of Western trade and shipping.\n**Yemen's government**: Too weak to control Houthis; relies on international military support.\n\n## Future Implications\n- Continued disruption of global trade if attacks aren't stopped\n- Permanent shift in shipping routes (around Africa) if Red Sea becomes too dangerous\n- Higher costs for consumers worldwide as shipping costs increase\n- Potential for direct military confrontation between US/allies and Houthis\n- Economic collapse of Yemen if civil war continues\n- Increased insurance costs and shipping company bankruptcies\n- Geopolitical competition as China, Russia, and others position themselves in the region\n\n## What to Watch\n- Will military action against Houthis be effective or escalate conflict?\n- Will shipping companies permanently abandon the Red Sea route?\n- How will this affect global inflation and consumer prices?\n- Will Iran escalate support for Houthis or seek negotiation?\n- Could this trigger wider regional conflict involving Saudi Arabia, UAE, and Iran?"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$Lf\",null,{\"story\":{\"simplified_title\":\"Red Sea Shipping Crisis Deepens as Houthi Attacks Continue, Disrupting Global Trade\",\"simplified_body\":\"$10\",\"quick_summary\":\"Houthi attacks on ships in the Red Sea are disrupting global trade, forcing expensive reroutes and raising shipping costs worldwide.\",\"deep_analysis\":\"$11\",\"why_it_matters\":\"This affects you because Red Sea disruptions increase shipping costs for goods imported to Australia (electronics, clothes, food), making them more expensive. If you buy anything shipped from Europe or Asia, you're paying more due to these attacks. Additionally, Australia has naval interests in the region and may be asked to contribute to protecting shipping, potentially involving Australian military personnel in the conflict.\",\"concepts\":[{\"term\":\"Maritime Trade Route\",\"definition\":\"A sea passage used by ships to transport goods between countries. Critical routes are heavily used and economically important.\",\"context\":\"The Red Sea is a chokepoint—a narrow passage where huge amounts of trade must pass through. Disrupting it affects global commerce and prices.\"},{\"term\":\"Shipping Costs\",\"definition\":\"The expense of transporting goods by ship. Includes fuel, labour, insurance, and fees. Higher shipping costs are passed to consumers as higher prices.\",\"context\":\"Red Sea attacks have increased shipping costs 30-50%, meaning everything shipped through that route becomes more expensive for Australian consumers.\"},{\"term\":\"Rerouting\",\"definition\":\"Changing the path a ship takes to avoid danger or obstacles. Alternative routes are often longer and more expensive.\",\"context\":\"Ships avoiding the Red Sea now sail around Africa, adding 2-3 weeks to journeys and significantly increasing fuel and labour costs.\"},{\"term\":\"Proxy Conflict\",\"definition\":\"A conflict where two major powers (like US and Iran) support different sides in a smaller country's conflict instead of fighting directly.\",\"context\":\"The Houthis are backed by Iran; the Yemeni government is backed by Saudi Arabia and the US. The Red Sea attacks are part of a larger US-Iran rivalry.\"}],\"category\":\"ECONOMY_MARKETS\",\"impact_score\":85,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news\"},{\"name\":\"The Economist\",\"url\":\"https://www.economist.com\"}],\"published_date\":\"2026-02-15\",\"id\":\"3650093f-c77d-45fc-925d-ada3a4f27ffa\",\"title\":\"Red Sea Shipping Crisis Deepens as Houthi Attacks Continue, Disrupting Global Trade\",\"description\":\"Houthi attacks on ships in the Red Sea are disrupting global trade, forcing expensive reroutes and raising shipping costs worldwide.\",\"tier\":\"GLOBAL\",\"region\":\"Middle East \u0026 Africa\",\"region_code\":\"MIDDLE_EAST_AFRICA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},\"children\":\"$L12\"}]\n"])</script><script>self.__next_f.push([1,"13:I[76479,[\"/feed/_next/static/chunks/16f248c184e9e255.js\",\"/feed/_next/static/chunks/f71fefea8f5e2d14.js\"],\"default\"]\n14:T48b,The Red Sea remains one of the world's most dangerous shipping routes in February 2026, with Houthi militants from Yemen attacking commercial vessels almost daily. The Houthis, an Iranian-backed group, claim they're attacking ships to protest the Gaza conflict and Israeli actions. However, their attacks have disrupted about 15% of global maritime ttacks have increased shipping costs 30-50%, meaning everything shipped through that route becomes more expensive for Australian consumers.\"]}]]}],[\"$\",\"div\",\"Rerouting\",{\"className\":\"bg-black/50 rounded-lg px-3 py-2.5 border border-white/[0.04]\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[13px] font-semibold text-zinc-200\",\"children\":\"Rerouting\"}],[\"$\",\"p\",null,{\"className\":\"text-[13px] text-zinc-400 leading-relaxed\",\"children\":\"Changing the path a ship takes to avoid danger or obstacles. Alternative routes are often longer and more expensive.\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"Ships avoiding the Red Sea now sail around Africa, adding 2-3 weeks to journeys and significantly increasing fuel and labour costs.\"]}]]}],[\"$\",\"div\",\"Proxy Conflict\",{\"className\":\"bg-black/50 rounded-lg px-3 py-2.5 border border-white/[0.04]\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[13px] font-semibold text-zinc-200\",\"children\":\"Proxy Conflict\"}],[\"$\",\"p\",null,{\"className\":\"text-[13px] text-zinc-400 leading-relaxed\",\"children\":\"A conflict where two major powers (like US and Iran) support different sides in a smaller country's conflict instead of fighting directly.\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"The Houthis are backed by Iran; the Yemeni government is backed by Saudi Arabia and the US. The Red Sea attacks are part of a larger US-Iran rivalry.\"]}]]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:T7b0,"])</script><script>self.__next_f.push([1,"## Historical Context\nThe Houthis are a Shia militant group that took control of northern Yemen in 2014-2015. Yemen has been in civil war since 2015, with Saudi Arabia and UAE supporting the government against the Houthis (who are backed by Iran). The Red Sea is one of the world's most important shipping routes—about 12% of global trade passes through it. The Houthis began attacking ships in late 2023, claiming solidarity with Palestinians in Gaza.\n\n## Multiple Perspectives\n**Houthis**: They're attacking ships to pressure countries to stop supporting Israel and to end the Gaza conflict. They claim they're defending Palestinians.\n**US/Western navies**: The attacks are piracy and terrorism that disrupt global commerce. Must be stopped militarily.\n**Shipping industry**: The attacks are economically devastating. Routes must be protected or alternative routes must be used.\n**Iran**: Denies directly controlling Houthis but benefits from disruption of Western trade and shipping.\n**Yemen's government**: Too weak to control Houthis; relies on international military support.\n\n## Future Implications\n- Continued disruption of global trade if attacks aren't stopped\n- Permanent shift in shipping routes (around Africa) if Red Sea becomes too dangerous\n- Higher costs for consumers worldwide as shipping costs increase\n- Potential for direct military confrontation between US/allies and Houthis\n- Economic collapse of Yemen if civil war continues\n- Increased insurance costs and shipping company bankruptcies\n- Geopolitical competition as China, Russia, and others position themselves in the region\n\n## What to Watch\n- Will military action against Houthis be effective or escalate conflict?\n- Will shipping companies permanently abandon the Red Sea route?\n- How will this affect global inflation and consumer prices?\n- Will Iran escalate support for Houthis or seek negotiation?\n- Could this trigger wider regional conflict involving Saudi Arabia, UAE, and Iran?"])</script><script>self.__next_f.push([1,"16:[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[\"$\",\"$L1a\",null,{\"analysis\":\"$1b\"}]}]\n17:[\"$\",\"$L1c\",null,{\"sources\":\"$7:props:story:sources\",\"confidence\":0.7,\"sourceCount\":3}]\n18:[\"$\",\"div\",null,{\"className\":\"mt-8 pt-4 border-t borde
