\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L7\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/feed/_next/static/chunks/f71fefea8f5e2d14.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L8\",null,{\"children\":[\"$\",\"$2\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@9\"}]}]]}],{},null,false,false]},null,false,false]},null,false,false]},null,false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$La\",null,{\"children\":\"$Lb\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Lc\",null,{\"children\":[\"$\",\"$2\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Ld\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$e\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"f:I[62646,[\"/feed/_next/static/chunks/16f248c184e9e255.js\",\"/feed/_next/static/chunks/f71fefea8f5e2d14.js\"],\"default\"]\n10:T4a7,A major hedge fund called Meridian Capital collapsed this week after losing billions betting against Asian currencies. This matters because Australian super funds and pension schemes had invested in Meridian, thinking it was a safe way to make extra money. Here's what happened: hedge funds are investment firms that use borrowed money to make big bets on financial markets—they might bet that a currency will fall, or that a stock price will rise. They're called 'hedge' funds because they try to protect (hedge) against losses by making opposite bets. Meridian borrowed heavily and bet that the Singapore dollar would weaken, but instead it strengthened, and they lost everything. When hedge funds collapse, everyday Australians lose retirement savings because super funds invested in them. The Australian Securities and Investments Authority (ASIC) is now investigating whether Australian investors were properly warned about the risks. This shows why understanding how these complex investments work matters—hedge funds can amplify both gains and losses, and when they fail, regular people suffer. The collapse has sparked calls for stricter rules on how much hedge funds can borrow.11:T5f2,"])</script><script>self.__next_f.push([1,"## Historical Context\nHedge funds emerged in the 1950s as investment vehicles for wealthy individuals. They operate differently from regular mutual funds—they can borrow money (use leverage), short-sell assets (bet prices will fall), and use complex derivatives. The 2008 financial crisis exposed how interconnected hedge funds were with the broader financial system; when Lehman Brothers collapsed, hedge funds worldwide faced massive losses. Australia's superannuation system has increasingly invested in hedge funds seeking higher returns in a low-interest environment.\n\n## Multiple Perspectives\n**Hedge fund supporters** argue they provide liquidity to markets and help price assets correctly. **Regulators** worry they're under-supervised and create systemic risk. **Retail investors** (everyday Australians) are concerned their retirement savings are being gambled with. **Developing nations** sometimes see hedge fund speculation destabilise their currencies.\n\n## Future Implications\nThis collapse will likely trigger regulatory tightening in Australia and Singapore. Super funds may reduce hedge fund exposure, shifting capital elsewhere. It could accelerate calls for a financial transaction tax to discourage rapid speculation.\n\n## What to Watch\n- ASIC's investigation findings (expected April 2026)\n- Whether other hedge funds face margin calls (forced selling)\n- Changes to Australian superannuation investment rules\n- How this affects the Australian dollar (if funds need to sell AUD assets to cover losses)"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$Lf\",null,{\"story\":{\"simplified_title\":\"Why a Hedge Fund Collapse in Singapore Just Cost Australians Millions\",\"simplified_body\":\"$10\",\"quick_summary\":\"A collapsed Singapore hedge fund has cost Australian super funds millions, exposing the risks of complex leveraged investments.\",\"deep_analysis\":\"$11\",\"why_it_matters\":\"This affects you because your superannuation—money your employer contributes for your retirement—is likely invested in funds that lost money in this collapse, meaning you'll have less money when you retire. If you're planning to study finance or work in banking, this shows why understanding leverage and risk management is critical to your career. The regulatory response will shape what kinds of investments are available to Australians in the future.\",\"concepts\":[{\"term\":\"Hedge Fund\",\"definition\":\"An investment firm that pools money from wealthy investors and uses aggressive strategies—including borrowing money (leverage), short-selling, and derivatives—to try to make large returns regardless of whether markets go up or down.\",\"context\":\"Meridian Capital used leverage (borrowed money) to amplify its bets, which magnified both potential gains and actual losses. When the bet went wrong, they couldn't repay what they'd borrowed.\"},{\"term\":\"Leverage (or Gearing)\",\"definition\":\"Borrowing money to invest more than you actually have. If you have $100 and borrow $400, you're investing $500 with 5x leverage. This multiplies both profits and losses.\",\"context\":\"Meridian borrowed heavily to make larger currency bets. When those bets failed, their losses were magnified, wiping out the fund entirely.\"},{\"term\":\"Short-Selling\",\"definition\":\"Betting that a stock or currency will fall in price. You borrow an asset, sell it immediately, then hope to buy it back cheaper later and pocket the difference.\",\"context\":\"Meridian short-sold the Singapore dollar, betting it would weaken. Instead it strengthened, forcing them to buy it back at a higher price, crystallising massive losses.\"},{\"term\":\"Systemic Risk\",\"definition\":\"When one financial institution's failure threatens the entire financial system because other institutions are interconnected to it through loans and investments.\",\"context\":\"If Meridian had been larger or more interconnected, its collapse could have triggered a cascade of failures at other banks and funds that had lent to it or invested with it.\"}],\"category\":\"ECONOMY_MARKETS\",\"impact_score\":72,\"sources\":[{\"name\":\"Australian Financial Review\",\"url\":\"https://www.afr.com/markets/hedge-fund-collapse-singapore-2026\"},{\"name\":\"ASIC Media Release\",\"url\":\"https://www.asic.gov.au/news/meridian-capital-investigation-2026\"},{\"name\":\"The Guardian Australia\",\"url\":\"https://www.theguardian.com/business/2026/feb/super-funds-hedge-fund-losses\"}],\"published_date\":\"2026-02-17\",\"id\":\"5eeb9d8a-60b2-4834-923f-b7a9ab900a9c\",\"title\":\"Why a Hedge Fund Collapse in Singapore Just Cost Australians Millions\",\"description\":\"A collapsed Singapore hedge fund has cost Australian super funds millions, exposing the risks of complex leveraged investments.\",\"tier\":\"GLOBAL\",\"region\":\"Global Systems\",\"region_code\":\"GLOBAL_SYSTEMS\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},\"children\":\"$L12\"}]\n"])</script><script>self.__next_f.push([1,"13:I[76479,[\"/feed/_next/static/chunks/16f248c184e9e255.js\",\"/feed/_next/static/chunks/f71fefea8f5e2d14.js\"],\"default\"]\n14:T4a7,A major hedge fund called Meridian Capital collapsed this week after losing billions betting against Asian currencies. This matters because Australian super funds and pension schemes had invested in Meridian, thinking it was a safe way to make extra money. Here's what happened: hedge funds are investment firms that use borrowed money to make big bets on f erage. This multiplies both profits and losses.\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"Meridian borrowed heavily to make larger currency bets. When those bets failed, their losses were magnified, wiping out the fund entirely.\"]}]]}],[\"$\",\"div\",\"Short-Selling\",{\"className\":\"bg-black/50 rounded-lg px-3 py-2.5 border border-white/[0.04]\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[13px] font-semibold text-zinc-200\",\"children\":\"Short-Selling\"}],[\"$\",\"p\",null,{\"className\":\"text-[13px] text-zinc-400 leading-relaxed\",\"children\":\"Betting that a stock or currency will fall in price. You borrow an asset, sell it immediately, then hope to buy it back cheaper later and pocket the difference.\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"Meridian short-sold the Singapore dollar, betting it would weaken. Instead it strengthened, forcing them to buy it back at a higher price, crystallising massive losses.\"]}]]}],[\"$\",\"div\",\"Systemic Risk\",{\"className\":\"bg-black/50 rounded-lg px-3 py-2.5 border border-white/[0.04]\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[13px] font-semibold text-zinc-200\",\"children\":\"Systemic Risk\"}],[\"$\",\"p\",null,{\"className\":\"text-[13px] text-zinc-400 leading-relaxed\",\"children\":\"When one financial institution's failure threatens the entire financial system because other institutions are interconnected to it through loans and investments.\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"If Meridian had been larger or more interconnected, its collapse could have triggered a cascade of failures at other banks and funds that had lent to it or invested with it.\"]}]]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:T5f2,"])</script><script>self.__next_f.push([1,"## Historical Context\nHedge funds emerged in the 1950s as investment vehicles for wealthy individuals. They operate differently from regular mutual funds—they can borrow money (use leverage), short-sell assets (bet prices will fall), and use complex derivatives. The 2008 financial crisis exposed how interconnected hedge funds were with the broader financial system; when Lehman Brothers collapsed, hedge funds worldwide faced massive losses. Australia's superannuation system has increasingly invested in hedge funds seeking higher returns in a low-interest environment.\n\n## Multiple Perspectives\n**Hedge fund supporters** argue they provide liquidity to markets and help price assets correctly. **Regulators** worry they're under-supervised and create systemic risk. **Retail investors** (everyday Australians) are concerned their retirement savings are being gambled with. **Developing nations** sometimes see hedge fund speculation destabilise their currencies.\n\n## Future Implications\nThis collapse will likely trigger regulatory tightening in Australia and Singapore. Super funds may reduce hedge fund exposure, shifting capital elsewhere. It could accelerate calls for a financial transaction tax to discourage rapid speculation.\n\n## What to Watch\n- ASIC's investigation findings (expected April 2026)\n- Whether other hedge funds face margin calls (forced selling)\n- Changes to Australian superannuation investment rules\n- How this affects the Australian dollar (if funds need to sell AUD assets to cover losses)"])</script><script>self.__next_f.push([1,"16:[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[\"$\",\"$L1a\",null,{\"analysis\":\"$1b\"}]}]\n17:[\"$\",\"$L1c\",null,{\"sources\":\"$7:props:story:sources\",\"confidence\":0.7,\"sourceCount\":3}]\n18:[\"$\",\"div\",null,{\"className\":\"mt-8 pt-4 border-t border-white/[0.06] flex items-center gap-3\",\"children\":[\"$\",\"$L1d\",null,{\"title\":\"Why a Hedge Fund Collapse in Singapore Just Cost Australians Millions\"}]
