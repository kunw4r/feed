aq (1981) and Syria (2007) and hasn't ruled out military action against Iran. New sanctions target Iran's oil exports, banking system, and aviation industry, crippling its economy. Iran's government says sanctions prove the West negotiates in bad faith and justify further nuclear development.11:T6d9,"])</script><script>self.__next_f.push([1,"## Historical Context\nIran's nuclear program began in the 1950s with US help. After the 1979 Islamic Revolution, the program became a symbol of Iranian independence. The 2015 Joint Comprehensive Plan of Action (JCPOA) was a deal where Iran limited enrichment in exchange for sanctions relief. The US withdrew from the deal in 2018 under President Trump, reimposing sanctions. Iran gradually abandoned the deal's limits. Now, in 2026, Iran is closer to nuclear weapons than ever.\n\n## Multiple Perspectives\n**Iran**: Nuclear weapons are necessary deterrent against US/Israeli military threats. Sanctions are unjust and prove diplomacy doesn't work. Nuclear energy is legitimate right.\n**US/Israel**: Nuclear-armed Iran would destabilise Middle East, enable terrorism, and threaten Israel's existence. Must be prevented by sanctions or military force.\n**EU**: Wants to preserve diplomacy but also concerned about nuclear proliferation. Caught between US pressure and desire to maintain trade with Iran.\n**Russia/China**: Oppose new sanctions; see them as Western imperialism. Benefit from closer ties with Iran.\n\n## Future Implications\n- Increased likelihood of Israeli or US military strike on Iranian nuclear facilities\n- Regional war could involve Israel, Iran, proxy forces (Hezbollah, Houthis), and potentially US\n- Oil prices would spike dramatically, affecting global economy\n- Refugee crisis if war breaks out\n- Further nuclear proliferation as other Middle Eastern countries pursue weapons\n\n## What to Watch\n- Will diplomacy resume or will military action occur?\n- How will Israel respond? Will it strike preemptively?\n- Will Russia or China intervene if military conflict starts?\n- How will this affect global oil markets and economies worldwide?"])</script><script>self.__next_f.push([1,"7:[\"$\",\"$Lf\",null,{\"story\":{\"simplified_title\":\"Iran's Nuclear Program Escalates as New Sanctions Threaten Regional War\",\"simplified_body\":\"$10\",\"quick_summary\":\"Iran has dramatically increased uranium enrichment toward weapons-grade levels, prompting new international sanctions and raising fears of military conflict.\",\"deep_analysis\":\"$11\",\"why_it_matters\":\"This affects you because a war between Iran and Israel could draw in the US and other powers, potentially involving Australia in a major regional conflict. It would also spike global oil prices, making petrol and goods more expensive in Australia. Additionally, understanding nuclear proliferation teaches you about global security threats and why countries pursue nuclear weapons.\",\"concepts\":[{\"term\":\"Nuclear Enrichment\",\"definition\":\"A technical process that increases the concentration of uranium-235 (the type that can sustain nuclear reactions). Low enrichment is for power plants; high enrichment is for weapons.\",\"context\":\"Iran enriching uranium to 84% purity is alarming because 90% is weapons-grade. This shows Iran is very close to having material for nuclear bombs.\"},{\"term\":\"Sanctions\",\"definition\":\"Economic penalties imposed by countries or international bodies on another country to pressure it to change behaviour. Can include trade restrictions, asset freezes, and export bans.\",\"context\":\"New sanctions on Iran target oil sales, banking, and aviation to cripple the economy and force Iran to abandon nuclear weapons development.\"},{\"term\":\"IAEA (International Atomic Energy Agency)\",\"definition\":\"A UN agency that inspects nuclear facilities worldwide to ensure countries aren't secretly building nuclear weapons. It's supposed to be independent and factual.\",\"context\":\"The IAEA confirmed Iran's enrichment levels, giving credibility to Western concerns. Its reports are crucial evidence in international disputes over nuclear programs.\"},{\"term\":\"Nuclear Deterrent\",\"definition\":\"A nuclear weapon kept as a threat to prevent other countries from attacking you. Based on the idea that no one will start a war if both sides have nuclear weapons (called 'mutually assured destruction').\",\"context\":\"Iran argues nuclear weapons are necessary to deter US or Israeli military action, similar to how Pakistan and North Korea justify their programs.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":95,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/middle-east\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world\"},{\"name\":\"The New York Times\",\"url\":\"https://www.nytimes.com/world\"}],\"published_date\":\"2026-02-18\",\"id\":\"36f371a2-daa0-49a1-b878-e513eb58bbdb\",\"title\":\"Iran's Nuclear Program Escalates as New Sanctions Threaten Regional War\",\"description\":\"Iran has dramatically increased uranium enrichment toward weapons-grade levels, prompting new international sanctions and raising fears of military conflict.\",\"tier\":\"GLOBAL\",\"region\":\"Middle East \u0026 Africa\",\"region_code\":\"MIDDLE_EAST_AFRICA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},\"children\":\"$L12\"}]\n"])</script><script>self.__next_f.push([1,"13:I[76479,[\"/feed/_next/static/chunks/16f248c184e9e255.js\",\"/feed/_next/static/chunks/f71fefea8f5e2d14.js\"],\"default\"]\n14:T43e,Iran announced in February 2026 that it has significantly expanded its nuclear enrichment capabilities, moving closer to weapons-grade uranium levels. This triggered immediate international alarm and new economic sanctions from the US, EU, and allies. Iran says its nuclear program is for peaceful energy purposes, but Western intelligence agencies assess it's pursuing nuclear weapons ca my and force Iran to abandon nuclear weapons development.\"]}]]}],[\"$\",\"div\",\"IAEA (International Atomic Energy Agency)\",{\"className\":\"bg-black/50 rounded-lg px-3 py-2.5 border border-white/[0.04]\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[13px] font-semibold text-zinc-200\",\"children\":\"IAEA (International Atomic Energy Agency)\"}],[\"$\",\"p\",null,{\"className\":\"text-[13px] text-zinc-400 leading-relaxed\",\"children\":\"A UN agency that inspects nuclear facilities worldwide to ensure countries aren't secretly building nuclear weapons. It's supposed to be independent and factual.\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"The IAEA confirmed Iran's enrichment levels, giving credibility to Western concerns. Its reports are crucial evidence in international disputes over nuclear programs.\"]}]]}],[\"$\",\"div\",\"Nuclear Deterrent\",{\"className\":\"bg-black/50 rounded-lg px-3 py-2.5 border border-white/[0.04]\",\"children\":[[\"$\",\"p\",null,{\"className\":\"text-[13px] font-semibold text-zinc-200\",\"children\":\"Nuclear Deterrent\"}],[\"$\",\"p\",null,{\"className\":\"text-[13px] text-zinc-400 leading-relaxed\",\"children\":\"A nuclear weapon kept as a threat to prevent other countries from attacking you. Based on the idea that no one will start a war if both sides have nuclear weapons (called 'mutually assured destruction').\"}],[\"$\",\"p\",null,{\"className\":\"text-[12px] text-zinc-600 mt-1 italic\",\"children\":[\"In this story: \",\"Iran argues nuclear weapons are necessary to deter US or Israeli military action, similar to how Pakistan and North Korea justify their programs.\"]}]]}]]}]]}]\n"])</script><script>self.__next_f.push([1,"1b:T6d9,"])</script><script>self.__next_f.push([1,"## Historical Context\nIran's nuclear program began in the 1950s with US help. After the 1979 Islamic Revolution, the program became a symbol of Iranian independence. The 2015 Joint Comprehensive Plan of Action (JCPOA) was a deal where Iran limited enrichment in exchange for sanctions relief. The US withdrew from the deal in 2018 under President Trump, reimposing sanctions. Iran gradually abandoned the deal's limits. Now, in 2026, Iran is closer to nuclear weapons than ever.\n\n## Multiple Perspectives\n**Iran**: Nuclear weapons are necessary deterrent against US/Israeli military threats. Sanctions are unjust and prove diplomacy doesn't work. Nuclear energy is legitimate right.\n**US/Israel**: Nuclear-armed Iran would destabilise Middle East, enable terrorism, and threaten Israel's existence. Must be prevented by sanctions or military force.\n**EU**: Wants to preserve diplomacy but also concerned about nuclear proliferation. Caught between US pressure and desire to maintain trade with Iran.\n**Russia/China**: Oppose new sanctions; see them as Western imperialism. Benefit from closer ties with Iran.\n\n## Future Implications\n- Increased likelihood of Israeli or US military strike on Iranian nuclear facilities\n- Regional war could involve Israel, Iran, proxy forces (Hezbollah, Houthis), and potentially US\n- Oil prices would spike dramatically, affecting global economy\n- Refugee crisis if war breaks out\n- Further nuclear proliferation as other Middle Eastern countries pursue weapons\n\n## What to Watch\n- Will diplomacy resume or will military action occur?\n- How will Israel respond? Will it strike preemptively?\n- Will Russia or China intervene if military conflict starts?\n- How will this affect global oil markets and economies worldwide?"])</script><script>self.__next_f.push([1,"16:[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[\"$\",\"$L1a\",null,{\"analysis\":\"$1b\"}]}]\n17:[\"$\",\"$L1c\",null,{\"sources\":\"$7:props:story:sources\",\"confidence\":0.7,\"sourceCount\":3}]\n18:[\"$\",\"div\",null,{\"className\":\"mt-8 pt-4 border-t border-white/[0.06] flex items-center gap-3\",\"children\":[\"$\",\"$L1d\",null,{\"title\":\"
