# Keeps the public Brainfeed fresh: three times a day the pipeline checks the news,
# adds only genuinely new important stories, commits the edition and redeploys Pages.
name: Update feed

on:
  schedule:
    # ~5:30am, 11:30am and 5:30pm in Brisbane (UTC+10, no daylight saving).
    # Off the hour on purpose: GitHub delays top-of-the-hour crons by hours under load.
    - cron: "23 19 * * *"
    - cron: "23 1 * * *"
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Rebuild the whole edition instead of adding to it"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/feed.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update the edition
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m pip install -q -r scripts/requirements.txt
          if [ "${{ inputs.fresh }}" = "true" ]; then
            python scripts/build_feed.py --excerpt 3
          else
            python scripts/build_feed.py --incremental --excerpt 3
          fi

      - name: Commit the edition
        if: github.event_name != 'push'
        run: |
          git config user.name "brainfeed-bot"
          git config user.email "brainfeed-bot@users.noreply.github.com"
          git add frontend/public/data/today.json frontend/public/data/articles frontend/public/data/archive
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(feed): update edition $(TZ=Australia/Brisbane date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push

      - name: Email the morning digest
        # Only the ~5:30am Brisbane run; send_digest.py skips itself unless the secrets are set
        if: github.event_name == 'schedule' && github.event.schedule == '23 19 * * *'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
        run: python scripts/send_digest.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          NEXT_PUBLIC_STATIC: "true"
        run: |
          npm ci
          npx next build
          touch out/.nojekyll

      - name: Warm the image cache
        # First request to the image proxy is slow; fetch today's sizes so readers hit a warm cache
        continue-on-error: true
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          d = json.load(open("frontend/public/data/today.json"))
          urls = [s["image_url"] for v in d["regions"].values() for s in v if s.get("image_url")]
          jobs = [f"https://wsrv.nl/?url={urllib.parse.quote(u, safe='')}&w={w}&output=webp&q=78" for u in urls for w in (480, 800, 1200, 1600)]
          def get(u):
              try:
                  return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "brainfeed-warmup"}), timeout=30).status
              except Exception:
                  return 0
          with ThreadPoolExecutor(12) as pool:
              ok = sum(code == 200 for code in pool.map(get, jobs))
          print(f"warmed {ok}/{len(jobs)} image renditions")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
