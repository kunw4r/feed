orting competition and demonstrated the Greek value of physical excellence and peaceful competition.\",\"has_content\":false},{\"year\":\"509 BCE\",\"title\":\"Roman Republic Established\",\"slug\":\"roman-republic-established\",\"summary\":\"Romans overthrew their last king and established a republic with elected officials, a senate, and a system of checks and balances.\",\"era\":\"CLASSICAL\",\"significance\":\"The Roman Republic created foundational concepts of representative government that influenced modern democracies and legal systems worldwide.\",\"has_content\":false},{\"year\":\"508 BCE\",\"title\":\"Athenian Democracy Founded\",\"slug\":\"athenian-democracy\",\"summary\":\"Athens introduced direct democracy where citizens voted on laws and policies, allowing ordinary people to participate in government decisions.\",\"era\":\"CLASSICAL\",\"significance\":\"Athenian democracy established the principle that ordinary citizens should have a voice in governance, forming the basis of modern democratic systems.\",\"has_content\":false},{\"year\":\"480 BCE\",\"title\":\"Battle of Salamis\",\"slug\":\"battle-salamis\",\"summary\":\"The Greek navy defeated the invading Persian fleet in a decisive naval battle, preventing Persian conquest of Greece.\",\"era\":\"CLASSICAL\",\"significance\":\"This victory preserved Greek independence and allowed Greek culture, philosophy, and democracy to flourish and influence Western civilisation.\",\"has_content\":false},{\"year\":\"221 BCE\",\"title\":\"Great Wall of China Construction Begins\",\"slug\":\"great-wall-china\",\"summary\":\"Chinese dynasties began constructing massive defensive walls across northern China to protect against invasions from nomadic peoples.\",\"era\":\"CLASSICAL\",\"significance\":\"The Great Wall represents one of humanity's largest construction projects and demonstrates China's engineering capabilities and military strategy.\",\"has_content\":false},{\"year\":\"206 BCE\",\"title\":\"Han Dynasty Established\",\"slug\":\"han-dynasty\",\"summary\":\"The Han Dynasty began ruling China, establishing a centralised government and expanding Chinese territory and influence across Asia.\",\"era\":\"CLASSICAL\",\"significance\":\"The Han Dynasty created a stable, prosperous empire that lasted 400 years and established many Chinese governmental and cultural traditions still recognised today.\",\"has_content\":false},{\"year\":\"100 BCE\",\"title\":\"Silk Road Trade Routes Established\",\"slug\":\"silk-road-established\",\"summary\":\"Trade routes connecting China, Central Asia, the Middle East, and Europe began operating, allowing merchants to exchange silk, spices, and goods.\",\"era\":\"CLASSICAL\",\"significance\":\"The Silk Road enabled unprecedented cultural, technological, and commercial exchange between distant civilisations, shaping global trade patterns for centuries.\",\"has_content\":false},{\"year\":\"27 BCE\",\"title\":\"Roman Empire Begins\",\"slug\":\"roman-empire-begins\",\"summary\":\"Augustus became the first Roman Emperor, transforming the republic into an empire that would dominate the Mediterranean for centuries.\",\"era\":\"CLASSICAL\",\"significance\":\"The Roman Empire created a vast, unified political system that spread Roman law, engineering, and culture across three continents, influencing Western civilisation.\",\"has_content\":false},{\"year\":\"1 CE\",\"title\":\"Birth of Jesus Christ\",\"slug\":\"birth-jesus-christ\",\"summary\":\"Jesus Christ was born in Bethlehem, and his teachings would eventually become the foundation of Christianity, the world's largest religion.\",\"era\":\"CLASSICAL\",\"significance\":\"Christianity became the dominant religion in the Western world, profoundly shaping European culture, law, art, and morality for two millennia.\",\"has_content\":false},{\"year\":\"320 CE\",\"title\":\"Gupta Empire Flourishes\",\"slug\":\"gupta-empire\",\"summary\":\"The Gupta Empire in India experienced a golden age of scientific, mathematical, and artistic achievement, including advances in astronomy and mathematics.\",\"era\":\"CLASSICAL\",\"significance\":\"The Gupta period produced the decimal system and the concept of zero, mathematical innovations that revolutionised mathematics and science worldwide.\",\"has_content\":false},{\"year\":\"330 CE\",\"title\":\"Constantinople Founded\",\"slug\":\"constantinople-founded\",\"summary\":\"Roman Emperor Constantine established Constantinople (modern Istanbul) as a new capital city on the Bosporus Strait between Europe and Asia.\",\"era\":\"CLASSICAL\",\"significance\":\"Constantinople became one of the world's most important cities, serving as the capital of the Byzantine Empire and a major centre of Christianity and trade.\",\"has_content\":false},{\"year\":\"476 CE\",\"title\":\"Fall of the Western Roman Empire\",\"slug\":\"fall-western-roman-empire\",\"summary\":\"The last Western Roman Emperor was deposed by Germanic invaders, marking the end of the Roman Empire in the West and the beginning of the Medieval period.\",\"era\":\"CLASSICAL\",\"significance\":\"The fall of Rome ended classical civilisation in the West, leading to the fragmentation of Europe and the rise of feudalism and medieval kingdoms.\",\"has_content\":false},{\"year\":\"570 CE\",\"title\":\"Birth of Prophet Muhammad\",\"slug\":\"birth-prophet-muhammad\",\"summary\":\"Muhammad was born in Mecca, and he would later found Islam, a religion that would become the world's second-largest faith.\",\"era\":\"MEDIEVAL\",\"significance\":\"Islam became a major world religion shaping the cultures, politics, and societies of the Middle East, North Africa, and Asia for over 1,400 years.\",\"has_content\":false},{\"year\":\"1066 CE\",\"title\":\"Norman Conquest of England\",\"slug\":\"norman-conquest-england\",\"summary\":\"William the Conqueror and his Norman forces defeated the English King Harold at the Battle of Hastings, establishing Norman rule over England.\",\"era\":\"MEDIEVAL\",\"significance\":\"The Norman Conquest transformed English culture, language, and governance, blending Norman-French and Anglo-Saxon traditions that shaped modern Britain.\",\"has_content\":false},{\"year\":\"1215 CE\",\"title\":\"Magna Carta Signed\",\"slug\":\"magna-carta\",\"summary\":\"English barons forced King John to sign the Magna Carta, a document limiting royal power and establishing that even kings must obey the law.\",\"era\":\"MEDIEVAL\",\"significance\":\"The Magna Carta established the principle of rule of law and limited government, becoming a foundational document for modern democracy and human rights.\",\"has_content\":false},{\"year\":\"1347 CE\",\"title\":\"Black Death Arrives in Europe\",\"slug\":\"black-death\",\"summary\":\"Bubonic plague spread from Asia to Europe via trade routes, killing approximately 75 million people and devastating European populations.\",\"era\":\"MEDIEVAL\",\"significance\":\"The Black Death fundamentally transformed European society, economy, and culture, leading to labour shortages that increased workers' rights and wages.\",\"has_content\":false},{\"year\":\"1368 CE\",\"title\":\"Ming Dynasty Established\",\"slug\":\"ming-dynasty\",\"summary\":\"The Ming Dynasty began ruling China, ending Mongol rule and initiating a period of cultural flourishing, architectural achievement, and maritime exploration.\",\"era\":\"MEDIEVAL\",\"significance\":\"The Ming Dynasty produced iconic Chinese achievements including the Forbidden City and sponsored voyages that demonstrated advanced maritime technology.\",\"has_content\":false},{\"year\":\"1453 CE\",\"title\":\"Fall of Constantinople\",\"slug\":\"fall-constantinople\",\"summary\":\"Ottoman forces conquered Constantinople, ending the Byzantine Empire and establishing Ottoman control over the strategic city linking Europe and Asia.\",\"era\":\"MEDIEVAL\",\"significance\":\"The fall of Constantinople marked the end of the Byzantine Empire and shifted the balance of power in the Mediterranean, prompting European exploration westward.\",\"has_content\":false},{\"year\":\"1440\",\"title\":\"Printing Press Invented\",\"slug\":\"printing-press-invented\",\"summary\":\"Johannes Gutenberg developed the movable type printing press in Germany, allowing books to be mass-produced for the first time.\",\"era\":\"RENAISSANCE\",\"significance\":\"This invention democratised knowledge and enabled the rapid spread of ideas, fundamentally transforming education and communication.\",\"has_content\":false},{\"year\":\"1492\",\"title\":\"Columbus Reaches the Americas\",\"slug\":\"columbus-reaches-americas\",\"summary\":\"Christopher Columbus sailed across the Atlantic Ocean and arrived in the Caribbean, initiating sustained European contact with the Americas.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This voyage triggered the age of European colonisation and globalisation, reshaping world demographics, trade, and politics.\",\"has_content\":false},{\"year\":\"1517\",\"title\":\"Protestant Reformation Begins\",\"slug\":\"protestant-reformation-begins\",\"summary\":\"Martin Luther challenged the Catholic Church's authority by posting his 95 Theses, sparking a religious revolution across Europe.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This schism created religious diversity in Europe and established principles of individual conscience that influenced modern democracy.\",\"has_content\":false},{\"year\":\"1543\",\"title\":\"Copernican Revolution\",\"slug\":\"copernican-revolution\",\"summary\":\"Nicolaus Copernicus published his theory that the Earth orbits the Sun, challenging centuries of accepted astronomical belief.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This heliocentric model launched the Scientific Revolution and demonstrated that established authorities could be wrong, enabling modern science.\",\"has_content\":false},{\"year\":\"1588\",\"title\":\"Spanish Armada Defeated\",\"slug\":\"spanish-armada-defeated\",\"summary\":\"England's naval forces defeated the Spanish Armada, establishing England as a major maritime power and protecting Protestant England.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This victory enabled England to become a global colonial power and eventually the world's dominant empire.\",\"has_content\":false},{\"year\":\"1607\",\"title\":\"Jamestown Colony Founded\",\"slug\":\"jamestown-colony-founded\",\"summary\":\"English settlers established Jamestown in Virginia, creating the first permanent English colony in North America.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This colony became the foundation for English-speaking North America and introduced slavery to what would become the United States.\",\"has_content\":false},{\"year\":\"1620\",\"title\":\"Mayflower Arrives at Plymouth\",\"slug\":\"mayflower-arrives-plymouth\",\"summary\":\"English Pilgrims sailed aboard the Mayflower and established Plymouth Colony in Massachusetts, seeking religious freedom.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This settlement became a foundational myth for American identity and represented early religious tolerance in the colonies.\",\"has_content\":false},{\"year\":\"1687\",\"title\":\"Newton's Principia Published\",\"slug\":\"newton-principia-published\",\"summary\":\"Isaac Newton published his Principia Mathematica, establishing the laws of motion and universal gravitation that explain how the physical world works.\",\"era\":\"EARLY_MODERN\",\"significance\":\"Newton's laws became the foundation of classical physics and demonstrated that nature operates according to mathematical principles.\",\"has_content\":false},{\"year\":\"1700\",\"title\":\"Age of Enlightenment Flourishes\",\"slug\":\"age-of-enlightenment\",\"summary\":\"European philosophers like Locke, Voltaire, and Rousseau promoted reason, individual rights, and questioning of absolute authority.\",\"era\":\"EARLY_MODERN\",\"significance\":\"Enlightenment ideas directly inspired modern democracy, human rights, and the scientific method we use today.\",\"has_content\":false},{\"year\":\"1707\",\"title\":\"Act of Union Creates Great Britain\",\"slug\":\"act-of-union-great-britain\",\"summary\":\"Scotland and England unified politically under one monarch and parliament, creating the Kingdom of Great Britain.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This union created a powerful nation-state that would become the world's dominant imperial power for two centuries.\",\"has_content\":false},{\"year\":\"1720\",\"title\":\"South Sea Bubble Bursts\",\"slug\":\"south-sea-bubble\",\"summary\":\"Speculative investment in the South Sea Company collapsed, causing massive financial losses and revealing the dangers of unregulated markets.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This early financial crisis demonstrated the need for market regulation and remains a cautionary tale about investment bubbles.\",\"has_content\":false},{\"year\":\"1756\",\"title\":\"Seven Years' War Begins\",\"slug\":\"seven-years-war-begins\",\"summary\":\"A global conflict erupted between Britain and France over colonial territories in North America, India, and elsewhere.\",\"era\":\"EARLY_MODERN\",\"significance\":\"Britain's victory made it the world's dominant colonial power and left France financially weakened, contributing to the French Revolution.\",\"has_content\":false},{\"year\":\"1760\",\"title\":\"Industrial Revolution Begins\",\"slug\":\"industrial-revolution-begins\",\"summary\":\"Britain began mechanising textile production with inventions like the spinning jenny and water frame, transforming manufacturing from handcraft to factory-based.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This shift to machine production created modern industrial society, urbanisation, and the working class that defines contemporary life.\",\"has_content\":false},{\"year\":\"1776\",\"title\":\"American Revolution Declared\",\"slug\":\"american-revolution-declared\",\"summary\":\"Thirteen British colonies in North America declared independence, rejecting British rule and establishing the United States of America.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This revolution created the first modern democratic republic and inspired democratic movements worldwide.\",\"has_content\":false},{\"year\":\"1776\",\"title\":\"Adam Smith's Wealth of Nations\",\"slug\":\"wealth-of-nations-published\",\"summary\":\"Scottish economist Adam Smith published his influential work explaining how free markets and division of labour create economic prosperity.\",\"era\":\"EARLY_MODERN\",\"significance\":\"Smith's ideas became the foundation of modern capitalism and continue to influence economic policy globally.\",\"has_content\":false},{\"year\":\"1789\",\"title\":\"French Revolution Begins\",\"slug\":\"french-revolution-begins\",\"summary\":\"French citizens stormed the Bastille and overthrew the absolute monarchy, establishing a republic based on liberty, equality, and fraternity.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This revolution established modern concepts of human rights, citizenship, and democracy that shaped the modern world.\",\"has_content\":false},{\"year\":\"1791\",\"title\":\"Haitian Revolution Begins\",\"slug\":\"haitian-revolution-begins\",\"summary\":\"Enslaved people in Haiti rebelled against French colonial rule and slavery, eventually establishing the first Black republic.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This revolution demonstrated that enslaved people could successfully fight for freedom and challenged the legitimacy of slavery globally.\",\"has_content\":false},{\"year\":\"1793\",\"title\":\"Reign of Terror in France\",\"slug\":\"reign-of-terror-france\",\"summary\":\"Revolutionary France executed thousands of perceived enemies, including King Louis XVI, during a period of extreme political violence.\",\"era\":\"EARLY_MODERN\",\"significance\":\"This period showed how revolutionary ideals could descend into authoritarianism, warning against unchecked political violence.\",\"has_content\":false},{\"year\":\"1798\",\"title\":\"Malthus Publishes Population Theory\",\"slug\":\"malthus-population-theory\",\"summary\":\"Thomas Malthus argued that population growth would outpace food production, creating inevitable poverty and suffering.\",\"era\":\"EARLY_MODERN\",\"significance\":\"Malthus's theory influenced debates about resource scarcity, poverty, and environmental limits that remain relevant today.\",\"has_content\":false},{\"year\":\"1799\",\"title\":\"Napoleon Takes Power in France\",\"slug\":\"napoleon-takes-power\",\"summary\":\"Military general Napoleon Bonaparte seized control of France, ending the Revolutionary period and establishing himself as a powerful authoritarian leader.\",\"era\":\"EARLY_MODERN\",\"significance\":\"Napoleon's rise demonstrated how revolutionary ideals could be corrupted by individual ambition, reshaping European politics for decades.\",\"has_content\":false},{\"year\":\"1804\",\"title\":\"Napoleon Crowns Himself Emperor\",\"slug\":\"napoleon-emperor-france\",\"summary\":\"French military leader Napoleon Bonaparte declared himself Emperor of France, ending the French Republic and establishing a powerful empire across Europe.\",\"era\":\"MODERN\",\"significance\":\"Demonstrated how individual ambition could reshape entire nations and established patterns of authoritarian rule that influenced European politics for centuries.\",\"has_content\":false},{\"year\":\"1815\",\"title\":\"Battle of Waterloo\",\"slug\":\"battle-waterloo\",\"summary\":\"British and allied forces defeated Napoleon's army in Belgium, ending his rule and reshaping the European balance of power.\",\"era\":\"MODERN\",\"significance\":\"Marked the end of Napoleonic Wars and established a new international system that influenced European diplomacy and stability for decades.\",\"has_content\":false},{\"year\":\"1833\",\"title\":\"British Slavery Abolition Act\",\"slug\":\"british-slavery-abolition\",\"summary\":\"Britain abolished slavery throughout its empire, freeing over 800,000 enslaved people and marking a major shift in moral attitudes towards human rights.\",\"era\":\"MODERN\",\"significance\":\"Set a precedent for other nations to abolish slavery and established that human freedom was a universal principle worth fighting for.\",\"has_content\":false},{\"year\":\"1851\",\"title\":\"Great Exhibition in London\",\"slug\":\"great-exhibition-london\",\"summary\":\"The world's first international exposition showcased industrial innovations and products from around the globe in a massive glass building called the Crystal Palace.\",\"era\":\"MODERN\",\"significance\":\"Celebrated industrial progress and globalisation, demonstrating how technology and trade were transforming society and connecting the world.\",\"has_content\":false},{\"year\":\"1859\",\"title\":\"Darwin Publishes Origin of Species\",\"slug\":\"darwin-origin-species\",\"summary\":\"Charles Darwin published his theory of evolution by natural selection, explaining how all living things descended from common ancestors and adapted over time.\",\"era\":\"MODERN\",\"significance\":\"Fundamentally changed how we understand biology, human origins and our place in nature, influencing science, philosophy and society ever since.\",\"has_content\":false},{\"year\":\"1861\",\"title\":\"American Civil War Begins\",\"slug\":\"american-civil-war-begins\",\"summary\":\"Southern states seceded from the United States to preserve slavery, triggering a devastating four-year war that killed over 600,000 people.\",\"era\":\"MODERN\",\"significance\":\"Determined whether the United States would survive as a unified nation and whether slavery would continue, shaping modern America's identity.\",\"has_content\":false},{\"year\":\"1865\",\"title\":\"Abolition of Slavery in America\",\"slug\":\"abolition-slavery-america\",\"summary\":\"The 13th Amendment to the US Constitution abolished slavery throughout the United States, freeing approximately 4 mill rning about the dangers of hatred and totalitarianism.\",\"has_content\":false},{\"year\":\"1945\",\"title\":\"Atomic Bombs Dropped on Japan\",\"slug\":\"atomic-bombs-japan\",\"summary\":\"The United States dropped atomic bombs on Hiroshima and Nagasaki, instantly killing over 200,000 people and ending World War II.\",\"era\":\"MODERN\",\"significance\":\"Nuclear weapons introduced the possibility of human extinction, fundamentally changing global politics and military strategy.\",\"has_content\":false},{\"year\":\"1945\",\"title\":\"End of World War II\",\"slug\":\"end-world-war-two\",\"summary\":\"World War II ended in Europe in May and in the Pacific in September after Germany and Japan surrendered.\",\"era\":\"MODERN\",\"significance\":\"The war's conclusion established the United States and Soviet Union as superpowers and divided the world into competing ideological blocs.\",\"has_content\":false},{\"year\":\"1945\",\"title\":\"United Nations Founded\",\"slug\":\"united-nations-founded\",\"summary\":\"The United Nations was established to promote international peace and cooperation, replacing the failed League of Nations.\",\"era\":\"MODERN\",\"significance\":\"The UN remains the primary forum for international diplomacy and continues to shape global governance today.\",\"has_content\":false},{\"year\":\"1947\",\"title\":\"Indian Independence\",\"slug\":\"indian-independence\",\"summary\":\"India gained independence from British rule under Mahatma Gandhi's leadership, becoming the world's largest democracy.\",\"era\":\"MODERN\",\"significance\":\"Indian independence sparked decolonisation across Asia and Africa, fundamentally reshaping the global balance of power.\",\"has_content\":false},{\"year\":\"1948\",\"title\":\"Creation of the State of Israel\",\"slug\":\"creation-state-israel\",\"summary\":\"The State of Israel was established in Palestine as a homeland for Jewish people following the Holocaust.\",\"era\":\"MODERN\",\"significance\":\"Israel's creation
