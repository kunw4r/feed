illions, China can demand political or military concessions\"},{\"term\":\"Indo-Pacific\",\"definition\":\"The strategic region spanning from India to the Pacific, including Australia, crucial for global trade and military power\",\"context\":\"Competition between China and Western nations (US, Australia) for influence in this region is reshaping global politics\"},{\"term\":\"Debt-trap diplomacy\",\"definition\":\"Offering loans with terms designed so borrowers cannot repay, forcing them to surrender assets or political control\",\"context\":\"Critics argue China uses this strategy; supporters say it's standard development finance\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":78,\"sources\":[{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news\"},{\"name\":\"The Guardian Australia\",\"url\":\"https://www.theguardian.com/australia-news\"},{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com\"}],\"published_date\":\"2026-02-17\",\"id\":\"2594ccff-1c9b-4ed8-9787-dac3c2d665cb\",\"title\":\"China's Pacific Island Influence Grows as Climate Crisis Deepens\",\"description\":\"China's infrastructure investments in Pacific Islands are expanding its regional influence while climate change threatens island nations' survival.\",\"tier\":\"GLOBAL\",\"region\":\"Australia \u0026 Oceania\",\"region_code\":\"OCEANIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Australia's AUKUS Submarine Program Hits $368 Billion as First Vessel Delayed\",\"simplified_body\":\"Australia's plan to build nuclear-powered submarines under the AUKUS alliance (Australia-UK-US) has blown out to $368 billion, with the first submarine now delayed until 2038—five years later than originally promised. The program involves building eight attack submarines in Adelaide using British and American technology. The massive cost increase reflects supply chain disruptions, skilled labour shortages, and complex nuclear technology integration. Defence experts argue the investment is necessary because China's military is rapidly expanding, and Australia needs advanced submarines to protect shipping lanes and maintain regional security. However, critics question whether the money could be better spent on other defence needs or domestic priorities like healthcare and education. The government insists the submarines are essential for Australia's long-term security.\",\"quick_summary\":\"Australia's AUKUS nuclear submarine program costs have soared to $368 billion with significant delays, raising questions about defence spending priorities.\",\"deep_analysis\":\"$16\",\"why_it_matters\":\"This affects you because as a young Australian, you'll likely pay taxes funding this $368 billion program over the next 15 years—that's money not available for education, healthcare, or climate action. Additionally, if the submarines are essential for Australia's security, you might face military service obligations or live with increased geopolitical tensions in the Indo-Pacific.\",\"concepts\":[{\"term\":\"Nuclear-powered submarine\",\"definition\":\"A submarine powered by a nuclear reactor, allowing it to stay submerged indefinitely and travel at high speeds\",\"context\":\"Nuclear submarines are more capable than diesel-electric submarines but far more expensive and complex to build and maintain\"},{\"term\":\"AUKUS alliance\",\"definition\":\"A security partnership between Australia, UK, and US focused on Indo-Pacific stability and technology sharing\",\"context\":\"AUKUS is a response to China's military expansion and represents deepening Western alliance coordination in Asia-Pacific\"},{\"term\":\"Cost blowout\",\"definition\":\"When a project's actual costs significantly exceed original budget estimates\",\"context\":\"Common in large defence projects due to technical complexity, inflation, and scope changes; creates political pressure\"},{\"term\":\"Deterrence\",\"definition\":\"Discouraging an adversary from attacking by demonstrating military capability and willingness to use it\",\"context\":\"Australia's submarines are meant to deter China from military aggression by making any attack costly\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":82,\"sources\":[{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news\"},{\"name\":\"The Australian\",\"url\":\"https://www.theaustralian.com.au\"},{\"name\":\"Defence News\",\"url\":\"https://www.defensenews.com\"}],\"published_date\":\"2026-02-18\",\"id\":\"bdf193e0-be9c-4647-8765-c66370ca6764\",\"title\":\"Australia's AUKUS Submarine Program Hits $368 Billion as First Vessel Delayed\",\"description\":\"Australia's AUKUS nuclear submarine program costs have soared to $368 billion with significant delays, raising questions about defence spending priorities.\",\"tier\":\"GLOBAL\",\"region\":\"Australia \u0026 Oceania\",\"region_code\":\"OCEANIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"New Zealand Election Shock: Labour Loses Majority as Cost-of-Living Crisis Deepens\",\"simplified_body\":\"New Zealand's Labour government has lost its parliamentary majority in a shock election result, with voters punishing the party over persistent inflation and housing costs. The centre-right National Party won the most seats but fell short of a majority, forcing complex coalition negotiations. New Zealand's inflation peaked at 7.3% in 2023 and, while declining, remains above the central bank's target—meaning everyday items like groceries and rent remain expensive for young people. The election reflects broader frustration across the Pacific with centre-left governments struggling to manage post-pandemic economic challenges. New Zealand's new government will likely pursue different economic policies, potentially affecting trade relationships with Australia and regional climate initiatives. The result signals that voters prioritise immediate cost-of-living relief over long-term policy goals.\",\"quick_summary\":\"New Zealand's Labour government lost its majority in elections driven by voter anger over inflation and housing costs.\",\"deep_analysis\":\"$17\",\"why_it_matters\":\"This affects you because New Zealand is Australia's closest neighbour and largest trading partner; changes in NZ policy directly impact Australian businesses, jobs, and regional stability. If NZ shifts right economically, it could influence Australian political debate and affect cross-Tasman cooperation on climate, defence, and trade issues.\",\"concepts\":[{\"term\":\"Inflation\",\"definition\":\"The rate at which prices for goods and services increase over time, reducing what money can buy\",\"context\":\"High inflation (7%+) means a $100 purchase costs $107 a year later; wages must rise to keep up or people get poorer\"},{\"term\":\"Interest rates\",\"definition\":\"The cost of borrowing money, set by central banks to control inflation and economic growth\",\"context\":\"When central banks raise rates to fight inflation, mortgages become more expensive, making housing less affordable\"},{\"term\":\"Coalition government\",\"definition\":\"When no single party wins a majority, multiple parties must work together to form government\",\"context\":\"Coalition governments are unstable; smaller parties can demand concessions, making policy unpredictable\"},{\"term\":\"Cost-of-living crisis\",\"definition\":\"When inflation and wage stagnation combine, making it harder for people to afford basic necessities\",\"context\":\"Typically drives political change as voters punish incumbent governments\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":65,\"sources\":[{\"name\":\"RNZ\",\"url\":\"https://www.rnz.co.nz\"},{\"name\":\"Stuff\",\"url\":\"https://www.stuff.co.nz\"},{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news\"}],\"published_date\":\"2026-02-16\",\"id\":\"3fa38126-61fc-4dc3-9207-ca7fc06ac84b\",\"title\":\"New Zealand Election Shock: Labour Loses Majority as Cost-of-Living Crisis Deepens\",\"description\":\"New Zealand's Labour government lost its majority in elections driven by voter anger over inflation and housing costs.\",\"tier\":\"GLOBAL\",\"region\":\"Australia \u0026 Oceania\",\"region_code\":\"OCEANIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Australian Universities Face Funding Crisis as International Student Numbers Plummet\",\"simplified_body\":\"Australian universities are facing a severe financial crisis as international student enrolments have dropped 15% in the past year, threatening billions in revenue and forcing staff redundancies. Universities depend heavily on international student fees (which are 3-4 times higher than domestic fees) to fund research and facilities. The decline is caused by stricter visa policies, competition from Canada and UK universities, and concerns about Australia's cost-of-living crisis making it expensive for international students. Universities are cutting research programs, delaying campus expansions, and laying off academics. This threatens Australia's reputation as an education destination and could reduce innovation in science and technology. The government is considering emergency funding but debates whether universities should rely less on international revenue. The crisis highlights how dependent Australian higher education has become on international income.\",\"quick_summary\":\"Australian universities are losing international students and billions in revenue, forcing budget cuts and staff layoffs.\",\"deep_analysis\":\"$18\",\"why_it_matters\":\"This affects you because if you're considering university, reduced international competition might improve your chances of admission, but your university experience could suffer from reduced research funding, fewer campus facilities, and potentially lower-quality teaching if experienced academics leave. Additionally, if universities collapse, Australia's innovation capacity declines, affecting job opportunities in tech and research sectors.\",\"concepts\":[{\"term\":\"Revenue diversification\",\"definition\":\"Reducing dependence on a single income source by developing multiple revenue streams\",\"context\":\"Universities relied too heavily on international student fees; when that revenue dropped, they faced crisis. Diversification would include government funding, research grants, and industry partnerships\"},{\"term\":\"Brain drain\",\"definition\":\"When talented people (especially academics and professionals) leave a country for better opportunities elsewhere\",\"context\":\"If Australian universities decline, academics will move to better-funded institutions in US, UK, or Canada, reducing Australia's research capacity\"},{\"term\":\"Visa policy\",\"definition\":\"Government rules determining who can enter and stay in a country, and for how long\",\"context\":\"Stricter visa policies reduce international student numbers; looser policies increase them. This is a policy lever governments use\"},{\"term\":\"Endowment\",\"definition\":\"A large sum of money invested to generate ongoing income for an institution\",\"context\":\"Top US universities (Harvard, Stanford) have massive endowments ($30+ billion) generating stable income; Australian universities lack this, making them vulnerable\"}],\"category\":\"SOCIETY_CULTURE\",\"impact_score\":71,\"sources\":[{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news\"},{\"name\":\"The Guardian Australia\",\"url\":\"https://www.theguardian.com/australia-news\"},{\"name\":\"Times Higher Education\",\"url\":\"https://www.timeshighereducation.com\"}],\"published_date\":\"2026-02-19\",\"id\":\"7386ef10-f93b-417a-b147-fe57734e7933\",\"title\":\"Australian Universities Face Funding Crisis as International Student Numbers Plummet\",\"description\":\"Australian universities are losing international students and billions in revenue, forcing budget cuts and staff layoffs.\",\"tier\":\"GLOBAL\",\"region\":\"Australia \u0026 Oceania\",\"region_code\":\"OCEANIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"}],\"ASIA\":[{\"simplified_title\":\"China's Property Crisis Deepens as Major Developer Defaults\",\"simplified_body\":\"$19\",\"quick_summary\":\"China's property sector is collapsing as major developers default on debt, threatening the entire economy and reducing demand for Australian exports.\",\"deep_analysis\":\"$1a\",\"why_it_matters\":\"This affects you because Australia's economy depends heavily on selling iron ore and coal to China—if Chinese construction collapses, demand plummets, reducing jobs in mining regions and government funding for services. Your superannuation may also hold Chinese assets or Australian companies exposed to China, so portfolio values could decline. Additionally, if Chinese investors stop buying Australian property, housing prices in major cities may stabilise or fall.\",\"concepts\":[{\"term\":\"Default\",\"definition\":\"When a borrower fails to make required payments on a debt obligation, such as interest or principal on bonds or loans.\",\"context\":\"Evergrande defaulted by not paying bondholders the interest owed on their investments, triggering a financial crisis.\"},{\"term\":\"GDP (Gross Domestic Product)\",\"definition\":\"The total monetary value of all goods and services produced by a country in a specific period. It measures economic size and growth.\",\"context\":\"Property represents 30% of China's GDP, meaning the sector is crucial to overall economic health.\"},{\"term\":\"Stimulus\",\"definition\":\"Government spending or central bank actions designed to boost economic activity, typically during downturns. Can include tax cuts, infrastructure spending, or lower interest rates.\",\"context\":\"China's government is using stimulus to try to revive property demand and consumer spending.\"},{\"term\":\"Capital flight\",\"definition\":\"When investors rapidly move money out of a country, usually due to loss of confidence. Often triggers currency weakness and economic instability.\",\"context\":\"Chinese citizens and investors are moving money overseas, weakening the yuan and reducing domestic investment.\"}],\"category\":\"ECONOMY_MARKETS\",\"impact_score\":78,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/business/finance/china-property-2026\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/china-property-crisis\"},{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news/business/china-economy\"}],\"published_date\":\"2026-02-16\",\"id\":\"31294f60-b066-4285-a1d0-6c102dd4e55e\",\"title\":\"China's Property Crisis Deepens as Major Developer Defaults\",\"description\":\"China's property sector is collapsing as major developers default on debt, threatening the entire economy and reducing demand for Australian exports.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"China Intensifies Tech Crackdowns as AI and Data Regulations Tighten\",\"simplified_body\":\"$1b\",\"quick_summary\":\"China's government is imposing strict regulations on tech giants to control AI development and data, limiting innovation and international competition.\",\"deep_analysis\":\"$1c\",\"why_it_matters\":\"This affects you because TikTok—used by millions of Australians—may face restrictions or bans if Chinese regulations make it uncompetitive or if Western governments respond with their own bans. If you're interested in tech careers, understanding how governments regulate AI and data is crucial—Australia will likely adopt similar rules. Additionally, if Chinese tech companies weaken, it could reduce competition for Australian and Western tech firms, potentially affecting innovation and job opportunities.\",\"concepts\":[{\"term\":\"Algorithm\",\"definition\":\"A set of rules or instructions that a computer follows to solve a problem or make decisions. In social media, algorithms decide what content you see.\",\"context\":\"Chinese regulations require government approval of algorithms that determine what users see, giving the state control over information flow.\"},{\"term\":\"Data sovereignty\",\"definition\":\"The principle that data collected within a country should be controlled by that country's government, not foreign companies or governments.\",\"context\":\"China's regulations enforce data sovereignty by requiring companies to store Chinese user data domestically and submit to government inspection.\"},{\"term\":\"Monopoly\",\"definition\":\"When one company dominates a market and has no real competition, allowing it to control prices and limit consumer choice.\",\"context\":\"Chinese regulators claim tech giants like Alibaba have monopoly power and use regulations to break them up or limit their growth.\"},{\"term\":\"Intellectual property (IP)\",\"definition\":\"Legal rights to original creations like inventions, software, or designs. Companies can patent or copyright their IP to prevent others from copying it.\",\"context\":\"Chinese regulations on AI training data raise questions about whether companies can use copyrighted material to train AI without permission.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":72,\"sources\":[{\"name\":\"Bloomberg\",\"url\":\"https://www.bloomberg.com/news/articles/china-tech-regulations\"},{\"name\":\"TechCrunch\",\"url\":\"https://techcrunch.com/2026/02/china-ai-regulations\"},{\"name\":\"SBS News\",\"url\":\"https://www.sbs.com.au/news/china-tech-crackdown\"}],\"published_date\":\"2026-02-17\",\"id\":\"30b4f7e0-d288-4db0-af53-ddac26d16b0f\",\"title\":\"China Intensifies Tech Crackdowns as AI and Data Regulations Tighten\",\"description\":\"China's government is imposing strict regulations on tech giants to control AI development and data, limiting innovation and international competition.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Taiwan Tensions Spike as China Conducts Military Exercises Near Strait\",\"simplified_body\":\"$1d\",\"quick_summary\":\"China's military exercises around Taiwan escalate tensions over the self-governed island, risking a conflict that could disrupt global tech supply chains and drag Australia into war.\",\"deep_analysis\":\"$1e\",\"why_it_matters\":\"This affects you because a China-Taiwan conflict could drag Australia into war—our ANZUS alliance with the U.S. might obligate us to fight alongside America against China. Even without war, the conflict would devastate the global economy and Australian trade. Your phone, laptop, and car depend on Taiwanese semiconductors—a conflict would make these products scarce and expensive. Additionally, if Australia enters a war, young people like you could be conscripted or face military service.\",\"concepts\":[{\"term\":\"Sovereignty\",\"definition\":\"The right of a country to govern itself independently without interference from other countries. A sovereign nation has supreme authority over its territory and people.\",\"context\":\"Taiwan claims sovereignty as an independent country, while China claims Taiwan is part of its sovereign territory—this fundamental disagreement drives the conflict.\"},{\"term\":\"Deterrence\",\"definition\":\"A military or diplomatic strategy of discouraging an adversary from attacking by threatening severe consequences. Works by making aggression too costly to be worthwhile.\",\"context\":\"The U.S. deters Chinese invasion by promising to defend Taiwan militarily, making the cost of invasion unacceptable to China.\"},{\"term\":\"Supply chain\",\"definition\":\"The network of companies and processes involved in producing and delivering a product, from raw materials to finished goods. Disruption at any point affects the entire chain.\",\"context\":\"Taiwan's semiconductor production is critical to global supply chains—conflict would disrupt manufacturing worldwide.\"},{\"term\":\"Ambiguity (strategic)\",\"definition\":\"Deliberately unclear statements about intentions or commitments, used in diplomacy to maintain flexibility and manage multiple parties' expectations.\",\"context\":\"The U.S. deliberately doesn't specify exactly how it would defend Taiwan, keeping both China and Taiwan uncertain and cautious.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":89,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/asia-pacific/taiwan-china-military\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/asia/taiwan\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/taiwan\"},{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news/world/taiwan\"}],\"published_date\":\"2026-02-18\",\"id\":\"61ce0199-5d7d-4d8a-954b-b301768ba638\",\"title\":\"Taiwan Tensions Spike as China Conducts Military Exercises Near Strait\",\"description\":\"China's military exercises around Taiwan escalate tensions over the self-governed island, risking a conflict that could disrupt global tech supply chains and drag Australia into war.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":4,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"India's Tech Sector Overtakes Japan as Asia's Second-Largest Economy\",\"simplified_body\":\"$1f\",\"quick_summary\":\"India has become Asia's second-largest economy, driven by tech sector growth and a young, educated workforce, reshaping regional geopolitics and creating opportunities for Australia.\",\"deep_analysis\":\"$20\",\"why_it_matters\":\"This affects you because India's tech sector is a major source of competition and opportunity for Australian tech workers—Indian developers are increasingly hired by Australian companies, affecting job markets and salaries. If you're studying tech, you'll likely compete with Indian talent globally. Additionally, India's economic rise means more Indian investment in Australia and more Australian opportunities in India. Geopolitically, India's alignment with Australia through the Quad means closer defence and security ties, potentially affecting Australia's strategic position in Asia.\",\"concepts\":[{\"term\":\"Outsourcing\",\"definition\":\"When a company hires another company (often in a different country) to perform tasks or services that were previously done in-house. Usually done to reduce costs.\",\"context\":\"Western tech companies outsource software development to Indian firms because Indian engineers cost less than Western ones, while producing high-quality work.\"},{\"term\":\"GDP per capita\",\"definition\":\"A country's total GDP divided by its population. Measures average wealth per person. A country can have large GDP but low per capita if population is huge.\",\"context\":\"India's GDP is now larger than Japan's, but India's GDP per capita is much lower because India has 1.4 billion people versus Japan's 125 million.\"},{\"term\":\"Venture capital\",\"definition\":\"Money invested in early-stage companies with high growth potential. Venture capitalists take on risk in exchange for ownership stakes and potential large returns.\",\"context\":\"Indian startups attract billions in venture capital funding from global investors betting on India's tech sector growth.\"},{\"term\":\"Liberalisation\",\"definition\":\"Reducing government regulations and controls on an economy, allowing more free market competition and foreign investment. Often includes opening markets to international trade.\",\"context\":\"India's 1991 liberalisation reforms removed restrictions on foreign investment and competition, enabling the tech sector to flourish.\"}],\"category\":\"ECONOMY_MARKETS\",\"impact_score\":75,\"sources\":[{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/india-economy-growth\"},{\"name\":\"The Hindu\",\"url\":\"https://www.thehindu.com/business/india-economy\"},{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news/business/india-economy\"},{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/business/india-economy-2026\"}],\"published_date\":\"2026-02-15\",\"id\":\"3685ed47-362f-4b06-b0ed-66308abfb701\",\"title\":\"India's Tech Sector Overtakes Japan as Asia's Second-Largest Economy\",\"description\":\"India has become Asia's second-largest economy, driven by tech sector growth and a young, educated workforce, reshaping regional geopolitics and creating opportunities for Australia.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":4,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Japan Accelerates Military Buildup as Aging Population Threatens Defence Capability\",\"simplified_body\":\"$21\",\"quick_summary\":\"Japan is dramatically increasing military spending to counter China while grappling with an aging, shrinking population that threatens its defence capability and economic future.\",\"deep_analysis\":\"$22\",\"why_it_matters\":\"This affects you because Japan's military buildup signals that regional conflict is becoming more likely, which could eventually involve Australia through our alliance commitments. Additionally, Japan's demographic crisis is a preview of Australia's future—our population is also aging, which will eventually reduce economic growth, increase government debt, and force difficult choices about immigration and military spending. If you're planning a career, understanding Japan's challenges with an aging workforce is relevant to Australia's future labour market.\",\"concepts\":[{\"term\":\"Demographics\",\"definition\":\"The study of population characteristics like age, birth rate, death rate, and migration. Demographic trends shape a country's economic and military future.\",\"context\":\"Japan's aging population (median age 49) means fewer young people to work or serve in the military, threatening economic growth and defence capability.\"},{\"term\":\"Defence spending (as % of GDP)\",\"definition\":\"Military expenditure expressed as a percentage of a country's total economic output. Shows how much a country prioritises military versus other spending.\",\"context\":\"Japan is increasing defence spending from 1% to 2% of GDP, a historic shift reflecting new security concerns.\"},{\"term\":\"Autonomous weapons\",\"definition\":\"Military systems that can select and engage targets without human control. Include drones, robots, and AI-guided missiles.\",\"context\":\"Japan is investing in autonomous weapons to compensate for fewer soldiers available due to population decline.\"},{\"term\":\"Alliance (military/strategic)\",\"definition\":\"A formal agreement between countries to cooperate militarily or diplomatically, usually against a common threat. Members commit to supporting each other.\",\"context\":\"Japan is deepening alliances with the U.S., Australia, and South Korea to create a coalition against China's military expansion.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":76,\"sources\":[{\"name\":\"NHK World\",\"url\":\"https://www3.nhk.or.jp/nhkworld/en/news/japan-military\"},{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/asia-pacific/japan-defence-spending\"},{\"name\":\"The Japan Times\",\"url\":\"https://www.japantimes.co.jp/news/japan-military-buildup\"},{\"name\":\"ABC News\",\"url\":\"https://www.abc.net.au/news/world/japan-military\"}],\"published_date\":\"2026-02-19\",\"id\":\"ab8038d3-f59f-4c27-a681-c959ee057bb1\",\"title\":\"Japan Accelerates Military Buildup as Aging Population Threatens Defence Capability\",\"description\":\"Japan is dramatically increasing military spending to counter China while grappling with an aging, shrinking population that threatens its defence capability and economic future.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":4,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"North Korea Launches New Missile, Tensions Rise Again\",\"simplified_body\":\"$23\",\"quick_summary\":\"North Korea tested a new long-range missile, escalating tensions with the US, South Korea, and Japan.\",\"deep_analysis\":\"$24\",\"why_it_matters\":\"This affects you because North Korea's weapons could trigger a war that disrupts global supply chains—affecting prices of electronics, clothes, and fuel in Australia. If conflict erupts, Australia might be drawn in through our alliance with the US, potentially affecting defence spending and security. Additionally, if North Korea sells weapons technology to hostile nations, it increases global instability that impacts Australia's trade and security.\",\"concepts\":[{\"term\":\"Sanctions\",\"definition\":\"Financial and trade punishments imposed by countries or the UN on another country to force behaviour change. They can ban exports, freeze bank accounts, or prevent companies from doing business.\",\"context\":\"The US and UN have imposed sanctions on North Korea for decades, but they haven't stopped the weapons program because China and Russia don't enforce them strictly.\"},{\"term\":\"Intercontinental Ballistic Missile (ICBM)\",\"definition\":\"A long-range missile that can travel thousands of kilometres and carry nuclear warheads. ICBMs can strike targets on different continents.\",\"context\":\"North Korea is developing ICBMs to threaten the US mainland, not just neighbouring countries. This is why the US takes these tests seriously.\"},{\"term\":\"Nuclear deterrence\",\"definition\":\"The strategy of possessing nuclear weapons so powerful that no one will attack you, because the damage would be unacceptable. It's based on the idea that mutual destruction prevents war.\",\"context\":\"North Korea believes nuclear weapons deter the US from invading. The US and allies worry that deterrence might fail if miscalculation occurs during a crisis.\"},{\"term\":\"Regime stability\",\"definition\":\"Whether a government can stay in power. A regime is unstable if it's at risk of being overthrown or collapsing.\",\"context\":\"North Korea's government stays in power partly through military strength and nuclear weapons. Without them, the regime might be vulnerable to internal rebellion or external pressure.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":78,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/asia-pacific/north-korea-missile-test-2026\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/asia\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/north-korea\"}],\"published_date\":\"2026-02-17\",\"id\":\"07549b4c-c67c-4828-911c-89a64f644db0\",\"title\":\"North Korea Launches New Missile, Tensions Rise Again\",\"description\":\"North Korea tested a new long-range missile, escalating tensions with the US, South Korea, and Japan.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"South Korea's Government Collapses in Political Crisis\",\"simplified_body\":\"$25\",\"quick_summary\":\"South Korea's President faces removal from office after attempting to declare martial law, creating political chaos and weakening the country's response to North Korean threats.\",\"deep_analysis\":\"$26\",\"why_it_matters\":\"This affects you because South Korea is a major trading partner of Australia, and political instability there can disrupt supply chains for electronics and manufactured goods. If South Korea's government becomes too weak to respond to North Korea, it could trigger conflict that affects global stability and Australia's security. Additionally, Australia has defence partnerships with South Korea, so internal chaos there weakens regional security arrangements that Australia depends on.\",\"concepts\":[{\"term\":\"Impeachment\",\"definition\":\"A formal process where parliament accuses a leader of wrongdoing and votes on whether to remove them from office. Impeachment doesn't automatically remove someone—it's the first step in a trial.\",\"context\":\"South Korea's parliament impeached the President, but the Constitutional Court must decide if the charges are valid and if he should be permanently removed.\"},{\"term\":\"Martial law\",\"definition\":\"Temporary rule by the military instead of civilian government. It suspends normal laws and rights, giving the military power to arrest people and enforce order without normal legal processes.\",\"context\":\"The President claimed martial law was needed to fight political opponents, but critics say this was an authoritarian power grab that violated the constitution.\"},{\"term\":\"Constitutional Court\",\"definition\":\"A special court that decides whether government actions follow the constitution (the country's basic rules). It can overturn laws or remove leaders if they violate the constitution.\",\"context\":\"South Korea's Constitutional Court is the final authority on whether the President's actions were legal. Its decision will determine whether he stays in office.\"},{\"term\":\"Political polarisation\",\"definition\":\"When a country's population splits into opposing groups with very different values and goals, making compromise difficult. Polarised countries struggle to make decisions because each side blocks the other.\",\"context\":\"South Korea is deeply polarised between left-wing and right-wing parties. This polarisation made the President desperate enough to try martial law, and it makes finding political solutions difficult.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":72,\"sources\":[{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/asia/south-korea-politics\"},{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/asia-pacific/south-korea-impeachment\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/south-korea\"}],\"published_date\":\"2026-02-16\",\"id\":\"4f3bc881-57b5-47e0-a21b-3c7dd06b45e5\",\"title\":\"South Korea's Government Collapses in Political Crisis\",\"description\":\"South Korea's President faces removal from office after attempting to declare martial law, creating political chaos and weakening the country's response to North Korean threats.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Vietnam and Indonesia Lead Southeast Asia's Economic Growth\",\"simplified_body\":\"$27\",\"quick_summary\":\"Vietnam and Indonesia are growing faster than most countries as foreign companies move factories there to reduce dependence on China.\",\"deep_analysis\":\"$28\",\"why_it_matters\":\"This affects you because Vietnam and Indonesia's growth means more competition for Australian exports and investment opportunities. If these countries become wealthier, they'll demand more resources (which Australia exports), potentially raising prices. Additionally, as Vietnam and Indonesia grow, they'll become more important geopolitically, and Australia will need to build stronger relationships with them. Job opportunities might also emerge for young Australians in these growing economies.\",\"concepts\":[{\"term\":\"Foreign Direct Investment (FDI)\",\"definition\":\"When a company from one country builds factories or businesses in another country. It's different from buying stocks—it's actually creating productive assets.\",\"context\":\"Vietnam and Indonesia are attracting FDI from companies like Apple, Samsung, and Nike, which are building factories there to produce goods for global markets.\"},{\"term\":\"De-risking\",\"definition\":\"The strategy of reducing dependence on a single country or supplier by spreading business across multiple locations. It reduces risk if one location becomes unstable.\",\"context\":\"Companies are de-risking from China by moving production to Vietnam, Indonesia, India, and other countries. This reduces their exposure if US-China tensions escalate or China's costs rise.\"},{\"term\":\"Supply chain diversification\",\"definition\":\"Having multiple sources for materials and production instead of relying on one country. It makes businesses more resilient to disruptions.\",\"context\":\"Vietnam and Indonesia benefit from supply chain diversification because companies want alternatives to China. If one country has problems, companies can shift production to another.\"},{\"term\":\"Commodity prices\",\"definition\":\"The cost of raw materials like oil, metals, and agricultural products. Commodity prices fluctuate based on global supply and demand.\",\"context\":\"Indonesia's growth is boosted by rising prices for oil, coal, and minerals. If commodity prices fall, Indonesia's growth could slow because these exports are important to its economy.\"}],\"category\":\"ECONOMY_MARKETS\",\"impact_score\":65,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/business/economy/vietnam-indonesia-growth-2026\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/asia-pacific/southeast-asia-economy\"},{\"name\":\"The Economist\",\"url\":\"https://www.economist.com/asia/vietnam-indonesia\"}],\"published_date\":\"2026-02-15\",\"id\":\"48360e3e-3e98-4522-bc75-eb647b109808\",\"title\":\"Vietnam and Indonesia Lead Southeast Asia's Economic Growth\",\"description\":\"Vietnam and Indonesia are growing faster than most countries as foreign companies move factories there to reduce dependence on China.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"ASEAN Nations Struggle to Unite on South China Sea Disputes\",\"simplified_body\":\"$29\",\"quick_summary\":\"ASEAN countries can't agree on how to respond to China's aggressive actions in the South China Sea, leaving smaller nations vulnerable.\",\"deep_analysis\":\"$2a\",\"why_it_matters\":\"This affects you because Australia depends on South China Sea shipping routes for trade and energy imports. If conflict erupts there, it could disrupt global supply chains and raise prices for goods in Australia. Additionally, Australia has defence partnerships with the Philippines and Vietnam, and might be drawn into a conflict if China becomes too aggressive. The South China Sea dispute is also a test of whether international law and smaller nations' rights matter—if China can ignore them, it sets a dangerous precedent for other powerful countries.\",\"concepts\":[{\"term\":\"Exclusive Economic Zone (EEZ)\",\"definition\":\"An area of ocean extending 200 kilometres from a country's coast where that country has rights to fish, mine, and extract resources. It's defined by international law (UNCLOS).\",\"context\":\"Vietnam, Philippines, and other countries have EEZs in the South China Sea, but China's claims overlap with these zones, creating disputes.\"},{\"term\":\"Sovereignty\",\"definition\":\"A country's right to govern itself and control its territory without interference from other countries. It's a fundamental principle of international law.\",\"context\":\"Vietnam and Philippines argue that China is violating their sovereignty by controlling waters and islands that belong to them under international law.\"},{\"term\":\"Freedom of navigation\",\"definition\":\"The right of ships from any country to pass through international waters without being stopped or restricted. It's guaranteed by international law.\",\"context\":\"China restricts ships from passing through areas it controls in the South China Sea, which violates freedom of navigation. The US and Australia challenge these restrictions by sailing through the area.\"},{\"term\":\"ASEAN consensus\",\"definition\":\"ASEAN's decision-making rule that requires all member countries to agree before taking action. If one country disagrees, the group can't act.\",\"context\":\"ASEAN can't take strong action against China because Cambodia and Laos refuse to agree, allowing China to continue its aggressive actions.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":81,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/asia-pacific/south-china-sea-asean\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/asia/south-china-sea\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/south-china-sea\"}],\"published_date\":\"2026-02-18\",\"id\":\"80e32f6e-dbbe-4f32-b261-ac9c2fdd4cb9\",\"title\":\"ASEAN Nations Struggle to Unite on South China Sea Disputes\",\"description\":\"ASEAN countries can't agree on how to respond to China's aggressive actions in the South China Sea, leaving smaller nations vulnerable.\",\"tier\":\"GLOBAL\",\"region\":\"Asia\",\"region_code\":\"ASIA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"}],\"EUROPE\":[{\"simplified_title\":\"Russia and Ukraine Begin First Peace Talks in 18 Months—But Major Disagreements Remain\",\"simplified_body\":\"$2b\",\"quick_summary\":\"Russia and Ukraine have started peace negotiations in Geneva, but disagree fundamentally on territorial control and war reparations.\",\"deep_analysis\":\"$2c\",\"why_it_matters\":\"This affects you because Australia is part of the Western alliance supporting Ukraine through sanctions and aid. If peace holds, global energy and food prices stabilise, making Australian exports more valuable. If war escalates, Australia might face pressure to increase military spending and could see more refugees arriving. The outcome also shapes whether authoritarian powers (like China) believe military conquest works.\",\"concepts\":[{\"term\":\"Territorial sovereignty\",\"definition\":\"A nation's legal right to control and govern land within its borders without external interference.\",\"context\":\"Ukraine argues Russia violated its sovereignty by invading; Russia claims eastern regions should be independent or Russian. This is the core dispute in peace talks.\"},{\"term\":\"Reparations\",\"definition\":\"Money or compensation paid by a defeated nation to cover war damages and losses suffered by the victim nation.\",\"context\":\"Ukraine is demanding Russia pay for destroyed cities, infrastructure, and lost lives. Similar to Germany paying after World War I, though that created resentment and contributed to WWII.\"},{\"term\":\"Security guarantees\",\"definition\":\"Formal agreements where other nations promise to defend a country if it's attacked again, or promise not to attack it.\",\"context\":\"Ukraine wants NATO membership or written guarantees from Western powers; Russia wants guarantees NATO won't expand eastward. These are incompatible demands.\"},{\"term\":\"Sanctions\",\"definition\":\"Economic penalties (trade bans, asset freezes, technology restrictions) imposed on a country to punish or pressure it into changing behaviour.\",\"context\":\"Western nations have sanctioned Russia's oil, banking, and tech sectors, costing its economy hundreds of billions. Peace talks might lead to sanctions relief.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":92,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/europe/russia-ukraine-peace-talks-2026\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/europe\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/ukraine\"}],\"published_date\":\"2026-02-17\",\"id\":\"8835a16c-3579-4332-904d-6dbe2a7b06cc\",\"title\":\"Russia and Ukraine Begin First Peace Talks in 18 Months—But Major Disagreements Remain\",\"description\":\"Russia and Ukraine have started peace negotiations in Geneva, but disagree fundamentally on territorial control and war reparations.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"European Nations Commit Record €450 Billion to Defence Spending—NATO's Biggest Military Buildup Since Cold War\",\"simplified_body\":\"$2d\",\"quick_summary\":\"European nations are spending a record €450 billion on defence over five years, the largest military buildup since the Cold War, driven by fear of Russian aggression.\",\"deep_analysis\":\"$2e\",\"why_it_matters\":\"This affects you because Australia is part of the AUKUS alliance with the UK and US, and European military strength shapes global security. If Europe becomes stronger militarily, it reduces pressure on Australia to increase defence spending. However, if an arms race develops, global military tensions rise, potentially affecting trade and creating refugee crises that reach Australia. You might also see defence industry jobs emerge in Australia as European nations buy weapons and technology from allied countries.\",\"concepts\":[{\"term\":\"NATO collective defence (Article 5)\",\"definition\":\"NATO's founding principle that an armed attack on one member triggers a response from all members. It's a mutual defence pact.\",\"context\":\"Article 5 has only been invoked once—by NATO after the 9/11 attacks on the US. If Russia attacked a NATO member, all 32 nations would be at war with Russia. This deters Russian aggression but also means Europe is locked into defending each other.\"},{\"term\":\"Defence spending as % of GDP\",\"definition\":\"A nation's military budget divided by its total economic output. Higher % means more resources devoted to military versus civilian needs.\",\"context\":\"NATO recommends 2% of GDP on defence. Germany now targets 3%, meaning roughly 1 euro of every 33 euros the government spends goes to the military. This is a significant reallocation from healthcare or education.\"},{\"term\":\"Deterrence\",\"definition\":\"The strategy of preventing an enemy from attacking by making the cost of attack too high. 'If you attack us, we'll hurt you badly.'\",\"context\":\"Europe's military buildup aims to deter Russia from invading NATO members. The logic: if Russia knows NATO can defeat it, Russia won't attack. This assumes rational decision-making by adversaries.\"},{\"term\":\"Arms race\",\"definition\":\"A cycle where two or more nations continuously increase military spending and weapons development, each fearing the other's growing strength.\",\"context\":\"Europe's spending increase might trigger Russia to spend more on weapons, which makes Europe feel less safe, leading to more European spending. This cycle can be destabilising and economically wasteful.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":85,\"sources\":[{\"name\":\"Politico Europe\",\"url\":\"https://www.politico.eu/article/european-defence-spending-2026\"},{\"name\":\"Deutsche Welle\",\"url\":\"https://www.dw.com/en/europe/defence-spending\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/world/europe\"}],\"published_date\":\"2026-02-18\",\"id\":\"5badfe54-88a0-4022-bde3-5d816e628e65\",\"title\":\"European Nations Commit Record €450 Billion to Defence Spending—NATO's Biggest Military Buildup Since Cold War\",\"description\":\"European nations are spending a record €450 billion on defence over five years, the largest military buildup since the Cold War, driven by fear of Russian aggression.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"EU Completes Shift Away From Russian Gas—First Winter Without Dependency as LNG Terminals Reach Full Capacity\",\"simplified_body\":\"$2f\",\"quick_summary\":\"Europe has ended Russian gas dependence by building LNG terminals and diversifying suppliers, completing a €200 billion transition that weakens Russia economically but increases energy costs.\",\"deep_analysis\":\"$30\",\"why_it_matters\":\"This affects you because Australia is a major LNG exporter, and European demand has made Australian energy companies highly profitable, generating tax revenue for government services. However, if Europe accelerates renewable energy, Australian LNG exports will eventually decline, affecting jobs in Queensland and Western Australia. You might also see higher energy prices in Australia as LNG is diverted to Europe, and climate impacts from continued fossil fuel use.\",\"concepts\":[{\"term\":\"Liquefied Natural Gas (LNG)\",\"definition\":\"Natural gas cooled to -161°C, turning it into liquid for easier transport via ship. When it arrives, it's warmed back into gas for use.\",\"context\":\"LNG allows Europe to import gas from distant suppliers (Australia, US, Qatar) instead of relying on pipelines from Russia. It's more expensive than pipeline gas but provides independence.\"},{\"term\":\"Energy security\",\"definition\":\"A nation's ability to reliably access affordable energy without dependence on potentially hostile suppliers.\",\"context\":\"Europe realised Russian gas dependence was a security risk. Diversifying suppliers and building renewable energy improves energy security by reducing vulnerability to coercion.\"},{\"term\":\"Geopolitical leverage\",\"definition\":\"Using economic or military power to influence another nation's behaviour or decisions.\",\"context\":\"Russia used gas supplies as leverage—threatening to cut off Europe if it supported Ukraine. Europe's shift to LNG removes this leverage, reducing Russia's ability to coerce European policy.\"},{\"term\":\"Energy transition\",\"definition\":\"The shift from fossil fuels (coal, oil, gas) to renewable energy sources (wind, solar, hydro) and nuclear power.\",\"context\":\"Europe's LNG transition is temporary; the long-term goal is renewable energy. This requires massive investment in wind farms, solar panels, and grid modernisation.\"}],\"category\":\"ENVIRONMENT_CLIMATE\",\"impact_score\":78,\"sources\":[{\"name\":\"Reuters Energy\",\"url\":\"https://www.reuters.com/business/energy/eu-russian-gas-2026\"},{\"name\":\"Euractiv\",\"url\":\"https://www.euractiv.com/section/energy\"},{\"name\":\"The Guardian Environment\",\"url\":\"https://www.theguardian.com/environment/energy\"}],\"published_date\":\"2026-02-16\",\"id\":\"b0a41faf-3ec4-4421-8559-12dc5c3e476c\",\"title\":\"EU Completes Shift Away From Russian Gas—First Winter Without Dependency as LNG Terminals Reach Full Capacity\",\"description\":\"Europe has ended Russian gas dependence by building LNG terminals and diversifying suppliers, completing a €200 billion transition that weakens Russia economically but increases energy costs.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"UK Economy Faces Persistent Brexit Drag—Trade Barriers Cost £40 Billion Annually as Post-Divorce Negotiations Stall\",\"simplified_body\":\"$31\",\"quick_summary\":\"The UK's post-Brexit economy faces £40 billion in annual trade costs, with negotiations stalled and growth lagging comparable nations, creating a political and economic dilemma.\",\"deep_analysis\":\"$32\",\"why_it_matters\":\"This affects you because Australia is negotiating a trade deal with the UK, and a weaker UK economy means less demand for Australian exports and potentially worse terms for Australian negotiators. If the UK economy continues to decline, Australian investment in the UK might decrease, affecting Australian companies with UK operations. You might also see fewer UK students and workers coming to Australia if the UK economy improves relative to Australia.\",\"concepts\":[{\"term\":\"Trade barriers\",\"definition\":\"Obstacles that make trade between nations more difficult or expensive, including tariffs (taxes on imports), quotas (limits on quantities), and regulatory requirements.\",\"context\":\"Post-Brexit, UK-EU trade faces new customs checks, tariffs on some goods, and regulatory compliance costs. These barriers didn't exist when the UK was in the EU, making trade more expensive.\"},{\"term\":\"Tariffs\",\"definition\":\"Taxes imposed on imported goods. They increase the price of imports and protect domestic producers from foreign competition.\",\"context\":\"Some UK-EU trade now faces tariffs (e.g., on agricultural products). These increase costs for British consumers and businesses importing from Europe.\"},{\"term\":\"Regulatory alignment\",\"definition\":\"When two nations adopt similar rules and standards, making it easier to trade because products don't need to be modified for different markets.\",\"context\":\"The UK and EU have different regulations on food safety, product standards, and financial services. Aligning these would reduce trade friction but requires the UK to follow EU rules.\"},{\"term\":\"GDP (Gross Domestic Product)\",\"definition\":\"The total value of goods and services produced by a nation in a year. It measures economic size and growth.\",\"context\":\"The UK's GDP growth is slower than comparable nations because Brexit has reduced trade and investment. A 4% permanent reduction in GDP means the UK economy is permanently smaller than it would have been.\"}],\"category\":\"ECONOMY_MARKETS\",\"impact_score\":72,\"sources\":[{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/world/uk\"},{\"name\":\"BBC News Business\",\"url\":\"https://www.bbc.com/news/business\"},{\"name\":\"The Economist\",\"url\":\"https://www.economist.com/britain\"}],\"published_date\":\"2026-02-19\",\"id\":\"60a4b53d-25ba-4a6c-9c79-e80f829232e6\",\"title\":\"UK Economy Faces Persistent Brexit Drag—Trade Barriers Cost £40 Billion Annually as Post-Divorce Negotiations Stall\",\"description\":\"The UK's post-Brexit economy faces £40 billion in annual trade costs, with negotiations stalled and growth lagging comparable nations, creating a political and economic dilemma.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Far-Right Parties Win Big in Dutch Elections, Reshaping EU Politics\",\"simplified_body\":\"The Netherlands held elections this week, and far-right parties gained significant seats in parliament for the first time. The Party for Freedom (PVV) and other nationalist groups won roughly 35% of votes combined, forcing traditional parties to negotiate with them to form government. This matters because the Netherlands is a founding EU member and economic powerhouse—if it shifts right, it could block EU policies on climate, immigration, and spending. The rise reflects frustration across Europe: voters feel ignored on immigration, worried about job security, and angry at Brussels bureaucracy. Similar movements are strong in Hungary, Poland, Italy, and France. Experts warn this could paralyse EU decision-making, since major policies need consensus. The next weeks will show whether mainstream parties will work with far-right groups or try to isolate them—a choice that will define European politics for years.\",\"quick_summary\":\"Far-right parties surged in Dutch elections, potentially destabilising EU governance and policy-making.\",\"deep_analysis\":\"$33\",\"why_it_matters\":\"This affects you because Australia's trade and security depend on a stable, unified Europe. If the EU fractures, global markets destabilise, making Australian exports (wine, minerals, education) less competitive. Plus, far-right movements globally often target immigration—Australia's skilled migration program could face similar pressure if these parties influence international norms.\",\"concepts\":[{\"term\":\"Populism\",\"definition\":\"A political movement claiming to represent 'the people' against corrupt elites, often using simple solutions to complex problems.\",\"context\":\"Far-right parties use populist rhetoric: 'We speak for ordinary workers; Brussels elites ignore you.' This resonates with voters feeling left behind.\"},{\"term\":\"Coalition government\",\"definition\":\"When no single party wins a majority, multiple parties must negotiate and share power to form a government.\",\"context\":\"Dutch mainstream parties must now decide: work with far-right (giving them real power) or exclude them (risking instability)?\"},{\"term\":\"Sovereignty\",\"definition\":\"A nation's right to govern itself without external interference.\",\"context\":\"Far-right parties argue EU rules override national sovereignty; they want more power returned to individual countries.\"},{\"term\":\"Democratic backsliding\",\"definition\":\"When elected governments gradually weaken democratic institutions (courts, media freedom, elections) from within.\",\"context\":\"Hungary's Orbán won elections but then weakened courts and press; EU fears far-right parties could do the same.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":78,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/europe/netherlands-elections-2026\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/europe\"},{\"name\":\"Politico Europe\",\"url\":\"https://www.politico.eu/article/netherlands-far-right\"}],\"published_date\":\"2026-02-17\",\"id\":\"d9ce5ea7-314d-4b9b-a2a6-faf4a20aff2f\",\"title\":\"Far-Right Parties Win Big in Dutch Elections, Reshaping EU Politics\",\"description\":\"Far-right parties surged in Dutch elections, potentially destabilising EU governance and policy-making.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"EU's Strict AI Rules Take Effect, Forcing Tech Giants to Overhaul Systems\",\"simplified_body\":\"The European Union's AI Act, passed last year, officially came into force this week. It's the world's toughest AI regulation, requiring companies to test systems for bias, transparency, and safety before release. Tech giants like OpenAI, Google, and Meta must now comply or face fines up to 6% of global revenue (billions of euros). The rules classify AI by risk: high-risk systems (used in hiring, loans, policing) face strict requirements; low-risk systems face fewer rules. This matters because Europe is setting the global standard—companies will likely follow EU rules worldwide rather than maintain separate versions. The move protects consumers from discriminatory algorithms but slows innovation. Some argue it gives Chinese AI companies an advantage since they face no such restrictions. The next months will show whether the rules actually work or just create bureaucratic burden.\",\"quick_summary\":\"EU's AI Act enforcement begins, imposing world's strictest rules on artificial intelligence development and deployment.\",\"deep_analysis\":\"$34\",\"why_it_matters\":\"This affects you because Australian tech companies and startups will need to comply with EU rules to access European markets. If you work in AI, data science, or tech, you'll need to understand these regulations. Plus, if the EU's approach works, Australia may adopt similar rules, changing how companies use your data and algorithms.\",\"concepts\":[{\"term\":\"Algorithmic bias\",\"definition\":\"When AI systems make unfair decisions based on protected characteristics (race, gender, age) because training data reflects historical discrimination.\",\"context\":\"An AI trained on hiring data where men were historically hired more will discriminate against women applicants. The EU Act requires testing for this.\"},{\"term\":\"Regulatory compliance\",\"definition\":\"The process of ensuring a company follows all relevant laws and rules; often requires hiring lawyers, auditors, and engineers.\",\"context\":\"Tech companies now need 'AI compliance officers' to ensure systems meet EU standards—this costs millions.\"},{\"term\":\"Risk-based regulation\",\"definition\":\"Rules that impose stricter requirements on higher-risk activities and lighter rules on lower-risk ones.\",\"context\":\"The EU Act treats AI used in hiring (high-risk) differently from AI used in video games (low-risk).\"},{\"term\":\"Regulatory arbitrage\",\"definition\":\"When companies relocate to jurisdictions with lighter regulations to avoid compliance costs.\",\"context\":\"Some fear EU AI rules will push startups to the US or Singapore, where rules are looser.\"}],\"category\":\"SCIENCE_TECH\",\"impact_score\":72,\"sources\":[{\"name\":\"The Verge\",\"url\":\"https://www.theverge.com/ai/2026/02/eu-ai-act-enforcement\"},{\"name\":\"Financial Times\",\"url\":\"https://www.ft.com/content/eu-ai-regulation-2026\"},{\"name\":\"Euractiv\",\"url\":\"https://www.euractiv.com/section/digital/news/ai-act-implementation\"}],\"published_date\":\"2026-02-16\",\"id\":\"3fd5a58d-d0a3-41d9-b04a-8b27766418da\",\"title\":\"EU's Strict AI Rules Take Effect, Forcing Tech Giants to Overhaul Systems\",\"description\":\"EU's AI Act enforcement begins, imposing world's strictest rules on artificial intelligence development and deployment.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Arctic Tensions Spike as Greenland Becomes Geopolitical Flashpoint Between US, Russia, and China\",\"simplified_body\":\"$35\",\"quick_summary\":\"Greenland emerges as a critical geopolitical battleground as the US, Russia, and China compete for Arctic dominance.\",\"deep_analysis\":\"$36\",\"why_it_matters\":\"This affects you because Arctic geopolitics influence global stability and trade. If conflict erupts in the Arctic, it could disrupt global supply chains, raising prices for electronics, fuel, and goods. Australia is also a Southern Ocean power; Arctic precedents (who controls what, how disputes are resolved) will shape how Australia's Antarctic interests are treated. Plus, climate change driving Arctic competition is the same force affecting Australia's weather and economy.\",\"concepts\":[{\"term\":\"Exclusive Economic Zone (EEZ)\",\"definition\":\"A maritime zone extending 200 nautical miles from a country's coast where it has rights to fish, mine, and extract resources.\",\"context\":\"Arctic nations are competing to expand their EEZs by claiming extended continental shelves, which would give them access to oil, gas, and minerals.\"},{\"term\":\"Geopolitical competition\",\"definition\":\"Rivalry between nations for power, influence, and resources, often without direct military conflict.\",\"context\":\"The US, Russia, and China are competing for Arctic dominance through military presence, investment, and diplomacy.\"},{\"term\":\"Strategic depth\",\"definition\":\"The distance from a country's borders to its heartland; countries with less strategic depth feel more vulnerable.\",\"context\":\"Russia sees the Arctic as crucial for strategic depth; NATO bases in Greenland would put the US closer to Russian territory.\"},{\"term\":\"Climate change as a geopolitical driver\",\"definition\":\"How environmental changes (melting ice, resource scarcity) create new conflicts and shift power dynamics.\",\"context\":\"Melting Arctic ice opens new shipping routes and resources, making the region suddenly valuable and contested.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":81,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/arctic/greenland-geopolitics-2026\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world/greenland-arctic\"},{\"name\":\"Arctic Today\",\"url\":\"https://www.arctictoday.com/news/2026/02/greenland-us-bases\"}],\"published_date\":\"2026-02-18\",\"id\":\"196b1c54-a6cc-4240-b972-983cddf7edb9\",\"title\":\"Arctic Tensions Spike as Greenland Becomes Geopolitical Flashpoint Between US, Russia, and China\",\"description\":\"Greenland emerges as a critical geopolitical battleground as the US, Russia, and China compete for Arctic dominance.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Europe's Migration Crisis Deepens as Border Walls Rise and Asylum Rules Tighten\",\"simplified_body\":\"$37\",\"quick_summary\":\"EU tightens asylum rules and builds border walls as migration pressures mount, raising humanitarian and legal concerns.\",\"deep_analysis\":\"$38\",\"why_it_matters\":\"This affects you because Australia faces similar migration pressures and debates. How Europe handles migration will influence global norms and Australia's own policies. Plus, if Europe becomes less welcoming, it may affect Australians working or studying in Europe. And if migration becomes a destabilising force in Europe, it could trigger economic instability affecting Australia's trade and investment.\",\"concepts\":[{\"term\":\"Refugee vs. economic migrant\",\"definition\":\"A refugee flees persecution or violence and qualifies for legal protection; an economic migrant seeks better living standards and has fewer legal protections.\",\"context\":\"The new EU rules make it harder to claim refugee status, pushing more people into the 'economic migrant' category with fewer rights.\"},{\"term\":\"Asylum\",\"definition\":\"Legal protection granted by a country to someone fleeing persecution in their home country.\",\"context\":\"Asylum seekers apply for protection; if approved, they become refugees with legal status.\"},{\"term\":\"Burden-sharing\",\"definition\":\"A system where responsibility (and costs) for handling migrants are distributed fairly among countries.\",\"context\":\"The EU struggles with burden-sharing; border countries like Greece and Italy want richer countries to accept more migrants.\"},{\"term\":\"Hybrid warfare\",\"definition\":\"Using non-military tactics (disinformation, economic pressure, migration flows) to destabilise an adversary.\",\"context\":\"Russia allegedly encourages migration to Europe to create political instability and weaken the EU.\"}],\"category\":\"SOCIETY_CULTURE\",\"impact_score\":76,\"sources\":[{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/europe/migration\"},{\"name\":\"Euractiv\",\"url\":\"https://www.euractiv.com/section/migration/news/asylum-rules-2026\"},{\"name\":\"Human Rights Watch\",\"url\":\"https://www.hrw.org/news/2026/02/eu-asylum-crisis\"}],\"published_date\":\"2026-02-19\",\"id\":\"64b359c7-359a-4bae-aa88-578d456da962\",\"title\":\"Europe's Migration Crisis Deepens as Border Walls Rise and Asylum Rules Tighten\",\"description\":\"EU tightens asylum rules and builds border walls as migration pressures mount, raising humanitarian and legal concerns.\",\"tier\":\"GLOBAL\",\"region\":\"Europe\",\"region_code\":\"EUROPE\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"}],\"MIDDLE_EAST_AFRICA\":[{\"simplified_title\":\"Israel Moves to Annex West Bank Settlements, Triggering International Crisis\",\"simplified_body\":\"Israel's government announced plans in February 2026 to formally annex Jewish settlements in the West Bank—territory occupied since 1967 but not officially claimed by Israel until now. This means Israel would declare these areas as officially part of Israel, rather than treating them as temporary settlements. The move immediately drew condemnation from the United Nations, European Union, and Arab nations, with many calling it illegal under international law. The Palestinian Authority said annexation destroys any chance of a two-state solution (where Israel and Palestine exist as separate countries). The US, traditionally Israel's closest ally, expressed \\\"serious concerns\\\" but stopped short of threatening sanctions. This escalates decades of conflict: Israel argues these settlements are necessary for security; Palestinians say they're illegal occupation of land promised to them. The announcement triggered protests across the Middle East and raised fears of renewed violence in Gaza and the West Bank.\",\"quick_summary\":\"Israel announced plans to annex West Bank settlements, sparking international outrage and deepening the Israeli-Palestinian conflict.\",\"deep_analysis\":\"$39\",\"why_it_matters\":\"This affects you because Australia has significant trade and defence relationships with both Israel and Arab nations, and this conflict could destabilise the entire Middle East region, affecting global oil prices, shipping routes, and potentially drawing in major powers like the US, Russia, and China. If violence escalates, it could impact Australian military deployments and refugee flows to countries like Australia.\",\"concepts\":[{\"term\":\"International Law \u0026 UN Resolutions\",\"definition\":\"Rules agreed by countries through the United Nations that are supposed to govern how nations behave. A UN Security Council Resolution is a binding decision that countries are supposed to follow.\",\"context\":\"UN Resolution 242 (1967) says countries shouldn't acquire territory by military force. Israel's annexation directly contradicts this principle, which is why it's considered illegal by most of the world.\"},{\"term\":\"Two-State Solution\",\"definition\":\"A proposed peace agreement where Israel and Palestine would exist as two separate, independent countries with their own governments, borders, and sovereignty.\",\"context\":\"This has been the goal of most peace negotiations since the 1990s. Annexation makes it nearly impossible because Palestinian territory would be too fragmented to form a viable state.\"},{\"term\":\"Occupation \u0026 Sovereignty\",\"definition\":\"Occupation means one country's military controls another territory. Sovereignty means a country has full control over its own territory and government. Annexation means claiming occupied territory as your own.\",\"context\":\"Israel occupies the West Bank militarily but hasn't claimed it as Israeli territory—until now. This distinction matters legally and politically.\"},{\"term\":\"Settlements\",\"definition\":\"Communities built by one country's citizens in territory controlled by another country. In this case, Israeli citizens living in the West Bank under Israeli military protection.\",\"context\":\"Over 600,000 Israeli settlers live in the West Bank. Most countries consider settlements illegal because they're built on land promised to Palestinians.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":92,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/middle-east\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world/middle_east\"},{\"name\":\"Al Jazeera\",\"url\":\"https://www.aljazeera.com\"}],\"published_date\":\"2026-02-17\",\"id\":\"1bb93541-5782-4a4b-841b-6eab8752e8cc\",\"title\":\"Israel Moves to Annex West Bank Settlements, Triggering International Crisis\",\"description\":\"Israel announced plans to annex West Bank settlements, sparking international outrage and deepening the Israeli-Palestinian conflict.\",\"tier\":\"GLOBAL\",\"region\":\"Middle East \u0026 Africa\",\"region_code\":\"MIDDLE_EAST_AFRICA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Gaza Faces Catastrophic Humanitarian Crisis as Aid Blockade Continues\",\"simplified_body\":\"$3a\",\"quick_summary\":\"Gaza faces a severe humanitarian crisis with widespread hunger, disease, and lack of medical care as international aid remains severely restricted.\",\"deep_analysis\":\"$3b\",\"why_it_matters\":\"This affects you because Australia is a major humanitarian aid donor, and your tax money may go to Gaza relief efforts. Additionally, the humanitarian crisis fuels regional instability that can affect global security, oil prices, and potentially Australian military involvement in the Middle East. Understanding humanitarian crises also teaches you about global inequality and Australia's role in addressing it.\",\"concepts\":[{\"term\":\"Blockade\",\"definition\":\"A military or political action that prevents goods, people, or information from entering or leaving a territory. Used to apply pressure or for security reasons.\",\"context\":\"Israel and Egypt's blockade of Gaza restricts what food, medicine, and materials can enter, claiming it prevents weapons smuggling but causing severe civilian suffering.\"},{\"term\":\"Collective Punishment\",\"definition\":\"Punishing an entire population for actions of some members. International law (Geneva Conventions) prohibits this because it's considered inhumane.\",\"context\":\"Critics argue the Gaza blockade is collective punishment because it harms 2.3 million civilians, including children and elderly who aren't involved in any conflict.\"},{\"term\":\"Humanitarian Aid\",\"definition\":\"Assistance (food, medicine, shelter, water) provided to people in crisis situations, usually by governments, NGOs, or the UN. Should be neutral and non-political.\",\"context\":\"Aid organisations struggle to deliver aid to Gaza because of blockade restrictions, creating a humanitarian emergency where basic survival needs aren't being met.\"},{\"term\":\"Infrastructure\",\"definition\":\"Basic systems a society needs to function: roads, electricity, water systems, hospitals, schools. When destroyed, a society can't provide basic services.\",\"context\":\"Gaza's infrastructure has been damaged by conflict, so even if blockade were lifted, hospitals and water systems can't function properly without reconstruction.\"}],\"category\":\"SOCIETY_CULTURE\",\"impact_score\":88,\"sources\":[{\"name\":\"UN News\",\"url\":\"https://news.un.org\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news\"},{\"name\":\"The Guardian\",\"url\":\"https://www.theguardian.com/world\"}],\"published_date\":\"2026-02-16\",\"id\":\"e171d2ff-d483-44e4-a23b-2e57565db711\",\"title\":\"Gaza Faces Catastrophic Humanitarian Crisis as Aid Blockade Continues\",\"description\":\"Gaza faces a severe humanitarian crisis with widespread hunger, disease, and lack of medical care as international aid remains severely restricted.\",\"tier\":\"GLOBAL\",\"region\":\"Middle East \u0026 Africa\",\"region_code\":\"MIDDLE_EAST_AFRICA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Iran's Nuclear Program Escalates as New Sanctions Threaten Regional War\",\"simplified_body\":\"$3c\",\"quick_summary\":\"Iran has dramatically increased uranium enrichment toward weapons-grade levels, prompting new international sanctions and raising fears of military conflict.\",\"deep_analysis\":\"$3d\",\"why_it_matters\":\"This affects you because a war between Iran and Israel could draw in the US and other powers, potentially involving Australia in a major regional conflict. It would also spike global oil prices, making petrol and goods more expensive in Australia. Additionally, understanding nuclear proliferation teaches you about global security threats and why countries pursue nuclear weapons.\",\"concepts\":[{\"term\":\"Nuclear Enrichment\",\"definition\":\"A technical process that increases the concentration of uranium-235 (the type that can sustain nuclear reactions). Low enrichment is for power plants; high enrichment is for weapons.\",\"context\":\"Iran enriching uranium to 84% purity is alarming because 90% is weapons-grade. This shows Iran is very close to having material for nuclear bombs.\"},{\"term\":\"Sanctions\",\"definition\":\"Economic penalties imposed by countries or international bodies on another country to pressure it to change behaviour. Can include trade restrictions, asset freezes, and export bans.\",\"context\":\"New sanctions on Iran target oil sales, banking, and aviation to cripple the economy and force Iran to abandon nuclear weapons development.\"},{\"term\":\"IAEA (International Atomic Energy Agency)\",\"definition\":\"A UN agency that inspects nuclear facilities worldwide to ensure countries aren't secretly building nuclear weapons. It's supposed to be independent and factual.\",\"context\":\"The IAEA confirmed Iran's enrichment levels, giving credibility to Western concerns. Its reports are crucial evidence in international disputes over nuclear programs.\"},{\"term\":\"Nuclear Deterrent\",\"definition\":\"A nuclear weapon kept as a threat to prevent other countries from attacking you. Based on the idea that no one will start a war if both sides have nuclear weapons (called 'mutually assured destruction').\",\"context\":\"Iran argues nuclear weapons are necessary to deter US or Israeli military action, similar to how Pakistan and North Korea justify their programs.\"}],\"category\":\"POLITICS_POLICY\",\"impact_score\":95,\"sources\":[{\"name\":\"Reuters\",\"url\":\"https://www.reuters.com/world/middle-east\"},{\"name\":\"BBC News\",\"url\":\"https://www.bbc.com/news/world\"},{\"name\":\"The New York Times\",\"url\":\"https://www.nytimes.com/world\"}],\"published_date\":\"2026-02-18\",\"id\":\"36f371a2-daa0-49a1-b878-e513eb58bbdb\",\"title\":\"Iran's Nuclear Program Escalates as New Sanctions Threaten Regional War\",\"description\":\"Iran has dramatically increased uranium enrichment toward weapons-grade levels, prompting new international sanctions and raising fears of military conflict.\",\"tier\":\"GLOBAL\",\"region\":\"Middle East \u0026 Africa\",\"region_code\":\"MIDDLE_EAST_AFRICA\",\"source_count\":3,\"confidence\":0.7,\"related_story_ids\":[],\"created_at\":\"2026-02-19T06:00:00.000000\"},{\"simplified_title\":\"Saudi Arabia's Vision 2030 Faces Reality Check as Oil Dependency Persists\",\"simplified_body\":\"$3e\",\"quick_summary\":\"Saudi Arabia's Vision 2030 economic transformation is falling short of ambitious goals, with oil still dominating the economy despite massive investment in diversification.\",\"deep_analysis\":\"$3f\",\"why_it_matters\":\"This affects you because Saudi Arabia is a major global oil producer, and if its economy destabilises, oil prices could spike, making petrol and goods more expensive in Australia. Additionally, if Saudi Arabia's economy weakens, it could affect regional stability in the Middle East and Australia's trade relationships. Understanding economic diversification also teaches you how countries adapt to changing global conditions.\",\"concepts\":[{\"term\":\"Economic Diversification\",\"definition\":\"Reducing dependence on one industry or product by developing other industries. Makes an economy more stable and less vulnerable to price shocks.\",\"context\":\"Saudi Arabia wants to move away from oil (which is volatile) toward tourism, technology, and manufacturing (which are more stable). But this is proving difficult and slow.\"},{\"term\":\"GDP (Gross Domestic Product)\",\"definition\":\"The total value of all goods and services a country produces in a year. It's the main measure of a country's economic size and health.\",\"context\":\"Oil makes up 50% of Saudi Arabia's GDP, meaning half the economy depends on one product. If oil prices fall, the entire economy suffers.\"},{\"term\":\"Government Revenue\",\"definition\":\"Money a government collects (mainly from taxes) to pay for services, infrastructure, an
