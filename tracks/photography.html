":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L8\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/feed/_next/static/chunks/75ec63104b458f64.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L9\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@a\"}]}]]}],{},null,false,false]},null,false,false]},null,false,false]},null,false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[24205,[\"/feed/_next/static/chunks/7c63d129e0aa498d.js\",\"/feed/_next/static/chunks/75ec63104b458f64.js\"],\"default\"]\n11:T669,"])</script><script>self.__next_f.push([1,"Think of your camera like your eye. Just as your pupil opens and closes to let in light, your camera has three main controls that work together to capture the perfect image.\n\nAperture is like the pupil of your eye. It's the opening in your lens that lets light in. A wider opening (lower f-number like f/2.8) lets in more light and creates a blurry background—great for portraits. A smaller opening (higher f-number like f/16) lets in less light but keeps everything sharp—perfect for landscapes.\n\nShutter speed is how long the sensor is exposed to light. Imagine opening and closing a window—the longer it stays open, the more light comes in. Fast shutter speeds (1/1000th of a second) freeze action, like capturing a jumping dog mid-air. Slow shutter speeds (1 second or longer) blur movement, creating dreamy waterfall effects.\n\nISO is your camera's sensitivity to light. Think of it like turning up the volume on a speaker. Higher ISO (like 3200) makes your sensor more sensitive, so you can shoot in dim conditions. But just as turning up volume creates noise, high ISO creates grainy photos. Low ISO (like 100) gives clean images but needs more light.\n\nThese three work together as the exposure triangle. If you use a fast shutter speed (less light), you might need a wider aperture or higher ISO to compensate. Learning to balance them is the foundation of photography.\n\nStart by shooting in Aperture Priority mode (A or Av on your camera). You control the aperture, and the camera adjusts shutter speed automatically. This helps you understand how aperture affects your images without worrying about all three settings at once."])</script><script>self.__next_f.push([1,"12:T728,"])</script><script>self.__next_f.push([1,"Good composition is like arranging furniture in a room. You could throw everything in the middle, but it looks boring. Strategic placement makes the space feel balanced and interesting.\n\nThe Rule of Thirds is your go-to composition tool. Imagine dividing your photo into a 3x3 grid with two horizontal and two vertical lines. Instead of placing your subject in the centre, place it where these lines intersect. This creates more dynamic, interesting photos. For example, when photographing a sunset, put the horizon on the lower third line rather than in the middle. This gives more space to the dramatic sky.\n\nMost cameras and phones have a grid overlay you can enable in settings. Use it! After a while, you'll naturally see these lines without needing the grid.\n\nLeading lines are paths that guide your viewer's eye through the photo. Think of them as invisible arrows pointing to your subject. A road disappearing into the distance, a river flowing through a landscape, or fence posts leading toward a building—these all work as leading lines. They create depth and make photos feel less flat.\n\nWhen you're composing your shot, look for natural lines in your environment. Position yourself so these lines point toward your main subject. A beach photo with waves creating diagonal lines leading to a person becomes much more engaging.\n\nOther composition basics include framing (using natural elements to frame your subject, like tree branches), symmetry (creating mirror images), and negative space (leaving empty areas to emphasise your subject).\n\nRemember: rules are meant to be broken once you understand them. Start by following these guidelines strictly. Once they feel natural, experiment with breaking them intentionally for creative effect. The best photographers know the rules well enough to know when to ignore them."])</script><script>self.__next_f.push([1,"13:T7bc,"])</script><script>self.__next_f.push([1,"Light is everything in photography. In fact, the word 'photography' literally means 'writing with light'. Without understanding light, even a perfectly composed shot with an expensive camera will look flat and uninteresting.\n\nThere are two main types of light: hard light and soft light. Hard light comes from a small, concentrated source like direct sunlight or a bare lightbulb. It creates strong shadows with sharp edges—great for dramatic, moody photos. Soft light comes from a large source or is diffused, like an overcast sky or light bouncing off a white wall. It's flattering and even, perfect for portraits because it minimises harsh shadows.\n\nDirection matters too. Front lighting (light coming toward the camera) is flat and boring. Side lighting (light from the side) creates dimension and texture. Backlighting (light behind the subject) creates silhouettes and rim lighting, which looks magical. Try photographing the same subject from different angles relative to the light source.\n\nGolden hour is a photographer's best friend. This is the hour after sunrise or before sunset when the sun is low and warm. The light is soft, directional, and flattering. Everything looks better during golden hour—it's almost impossible to take a bad photo. If you're serious about improving, shoot during golden hour whenever possible.\n\nAvoid shooting in harsh midday sun when the sun is directly overhead. The light is too bright and creates unflattering shadows under eyes and noses. If you must shoot midday, find shade or use reflectors to bounce light onto your subject.\n\nIndoors, position your subject near a window for natural light. If that's not possible, use multiple light sources and bounce light off white surfaces to soften shadows. Even a white sheet can act as a reflector.\n\nPractice observing light throughout the day. Notice how it changes colour, direction, and quality. This awareness will transform your photography more than any camera upgrade ever could."])</script><script>self.__next_f.push([1,"14:T7ee,"])</script><script>self.__next_f.push([1,"Portrait photography is about capturing someone's essence and making them look their best. It's not just about technical settings—it's about connection and making your subject feel comfortable.\n\nStart with the right lens. A 50mm or 85mm lens is ideal for portraits because it flatters faces and creates that blurry background (bokeh) that makes subjects pop. If you only have a kit lens, that's fine—just zoom in to at least 50mm equivalent.\n\nAperture is crucial for portraits. Use a wide aperture (f/2.8 to f/5.6) to blur the background and isolate your subject. This separation between subject and background is what makes professional portraits look professional.\n\nPosition your subject slightly off-centre using the Rule of Thirds. Have them look slightly past the camera rather than directly at it—this creates a more natural, contemplative feel. If they look directly at the camera, ensure they're looking at the lens, not the screen.\n\nLighting makes or breaks a portrait. Position your subject near a window for soft, directional light. If using sunlight, position them so the light comes from the side or slightly behind, not directly in front. Avoid harsh shadows under the eyes and nose.\n\nFor the pose, have your subject turn their shoulders at a slight angle to the camera rather than facing straight on. This is more flattering. Ask them to relax their arms—crossed arms look defensive. Have them hold something or rest their hand on their leg.\n\nConnection is everything. Talk to your subject, make them laugh, ask them questions. The best portraits capture genuine emotion, not stiff smiles. Take lots of shots—professionals take hundreds to get a few keepers.\n\nCommon mistakes: shooting from below (unflattering), having them smile too hard (looks fake), cluttered backgrounds (distracting), and poor lighting (the biggest culprit). Fix these and your portraits will improve dramatically.\n\nAlways get permission before photographing people, and show them the results. Building trust leads to better photos."])</script><script>self.__next_f.push([1,"15:T8a5,"])</script><script>self.__next_f.push([1,"Landscape and street photography are about telling stories with environments. Instead of focusing on a single subject, you're composing entire scenes.\n\nFor landscapes, start with composition. Use leading lines (rivers, roads, fence lines) to guide the viewer through the image. Apply the Rule of Thirds, placing the horizon on the upper or lower third rather than in the middle. Include foreground interest—a rock, flower, or person—to add depth and scale.\n\nDepth is crucial in landscapes. Include three layers: foreground (close), middle ground (medium distance), and background (far). This creates a sense of dimension that makes flat landscapes come alive. A wide-angle lens (14-35mm) helps capture expansive scenes, but don't just point and shoot—compose carefully.\n\nFor landscape exposure, you often want everything sharp from foreground to background. Use a smaller aperture (f/8 to f/16) and focus about one-third into the scene. This technique is called hyperfocal distance and ensures maximum sharpness.\n\nStreet photography captures candid moments in public spaces. It's about finding interesting light, compositions, and human moments. The best street photographers are observers—they notice patterns, light, and interesting characters.\n\nComposition is everything in street photography. Look for leading lines, frames within frames, and interesting juxtapositions. Wait for the right moment when light, subject, and composition align perfectly. This is called 'decisive moment'—pressing the shutter at exactly the right instant.\n\nA 35mm or 50mm lens is ideal for street work. It's wide enough to capture context but tight enough to isolate subjects. Prime lenses (fixed focal length) force you to move and think about composition rather than just zooming.\n\nEthics matter in street photography. Always respect people's privacy and local laws. In many places, you can photograph in public without permission, but be respectful. If someone objects, delete the photo and move on.\n\nBoth genres reward patience and observation. Spend time in locations, watch light change, notice patterns. The best photos come from understanding your environment deeply, not from rushing around taking random shots."])</script><script>self.__next_f.push([1,"16:T88a,"])</script><script>self.__next_f.push([1,"Editing is the final step in photography. A great photo starts with good technique, but editing brings it to life. Think of editing like seasoning food—a little enhances flavour, but too much ruins it.\n\nStart with exposure and contrast. If your image is too dark, increase exposure. If it's too bright, decrease it. Contrast makes images pop by deepening shadows and brightening highlights. Increase contrast slightly on most photos—it's the most impactful adjustment.\n\nWhite balance corrects colour temperature. If your photo looks too blue (cool) or too orange (warm), adjust white balance. Most editing software has presets like 'daylight', 'cloudy', or 'tungsten' that fix this instantly. Getting white balance right makes colours look natural.\n\nSaturation controls colour intensity. Slightly increasing saturation (10-20%) makes colours pop without looking fake. Be careful—oversaturated photos look artificial. Desaturate specific colours to create mood, like desaturating everything except one colour for dramatic effect.\n\nClarity and texture add punch. Clarity enhances mid-tone contrast, making details pop. Texture adds fine detail. Use these sparingly—too much looks harsh and unnatural.\n\nCropping is powerful. If your composition isn't quite right, crop to improve it. Remove distracting elements from edges. Sometimes a tighter crop transforms a mediocre photo into a great one.\n\nSpot removal tools fix distracting blemishes—a stray branch, a person in the background, or skin blemishes in portraits. Use these subtly.\n\nCommon editing mistakes: over-sharpening (creates halos), over-saturation (looks fake), crushed blacks (losing shadow detail), and blown highlights (losing bright detail). Aim for natural-looking enhancement, not obvious manipulation.\n\nPopular editing software includes Lightroom (best for beginners), Capture One, and Photoshop. Phone apps like Snapseed and VSCO are surprisingly powerful. Start with Lightroom—it's intuitive and non-destructive (you can always undo changes).\n\nRemember: editing enhances good photos but can't fix bad ones. Master exposure, composition, and lighting first. Editing is the cherry on top, not the foundation."])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-5 py-8\",\"children\":[[\"$\",\"nav\",null,{\"className\":\"mb-6\",\"children\":[\"$\",\"$L7\",null,{\"href\":\"/tracks\",\"className\":\"flex items-center gap-1 text-[13px] text-content-faint hover:text-content transition-colors\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":14,\"height\":14,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-arrow-left\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1l729n\",{\"d\":\"m12 19-7-7 7-7\"}],[\"$\",\"path\",\"x3x0zl\",{\"d\":\"M19 12H5\"}],\"$undefined\"]}],\"Learning Tracks\"]}]}],[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold text-content tracking-tight mb-2\",\"children\":\"Photography Basics\"}],[\"$\",\"p\",null,{\"className\":\"text-[14px] text-content-dim leading-relaxed mb-3\",\"children\":\"Learn the fundamental skills to take better photos. From understanding how cameras work to editing your images, this track covers everything a beginner needs to start their photography journey.\"}],[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 text-[12px] text-content-faint\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":13,\"height\":13,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-book-open\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1akyts\",{\"d\":\"M12 7v14\"}],[\"$\",\"path\",\"ruj8y\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 ct\"},{\"term\":\"Framing\",\"definition\":\"Using natural elements in the scene to create a frame around your subject\"},{\"term\":\"Negative Space\",\"definition\":\"Empty areas in the composition that help emphasise the main subject\"}]},{\"title\":\"Lighting Fundamentals: The Most Important Element\",\"content\":\"$13\",\"key_takeaways\":[\"Hard light creates drama; soft light is flattering\",\"Light direction (front, side, back) dramatically affects mood\",\"Golden hour provides the most beautiful natural light\",\"Observe and understand light in your environment\"],\"concepts\":[{\"term\":\"Hard Light\",\"definition\":\"Concentrated light from a small source that creates sharp, defined shadows\"},{\"term\":\"Soft Light\",\"definition\":\"Diffused light from a large source that creates gentle, subtle shadows\"},{\"term\":\"Golden Hour\",\"definition\":\"The period shortly after sunrise or before sunset when sunlight is warm, soft, and directional\"},{\"term\":\"Backlighting\",\"definition\":\"Light positioned behind the subject, creating silhouettes or rim lighting effects\"}]},{\"title\":\"Portrait Photography Tips: Capturing People Beautifully\",\"content\":\"$14\",\"key_takeaways\":[\"Use 50-85mm lenses and wide apertures for flattering portraits\",\"Position subjects off-centre and at angles to the camera\",\"Soft, directional lighting is essential for beautiful skin tones\",\"Connection and genuine emotion matter more than technical perfection\"],\"concepts\":[{\"term\":\"Bokeh\",\"definition\":\"The blurry background created by wide apertures that isolates the subject\"},{\"term\":\"Focal Length\",\"definition\":\"The lens's magnification; 50-85mm is ideal for portraits as it flatters faces\"},{\"term\":\"Depth of Field\",\"definition\":\"The area of the photo that's in focus; wide apertures create shallow depth of field\"},{\"term\":\"Catchlight\",\"definition\":\"The reflection of light in a subject's eyes that makes them appear alive and engaging\"}]},
