\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L8\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/feed/_next/static/chunks/75ec63104b458f64.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L9\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@a\"}]}]]}],{},null,false,false]},null,false,false]},null,false,false]},null,false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[24205,[\"/feed/_next/static/chunks/7c63d129e0aa498d.js\",\"/feed/_next/static/chunks/75ec63104b458f64.js\"],\"default\"]\n11:T649,"])</script><script>self.__next_f.push([1,"Imagine Earth's surface as a cracked eggshell floating on hot liquid inside. That's essentially what plate tectonics is. The Earth's outer layer, called the crust, is broken into massive pieces called tectonic plates that constantly move—usually just a few centimetres per year.\n\nThese plates are like puzzle pieces that fit together but never stop shifting. Where they meet, three things can happen. Sometimes they slide past each other (like two cars passing), sometimes they collide and push upward (creating mountains), and sometimes one plate slides under another (called subduction).\n\nVolcanoes and earthquakes are the dramatic results of this movement. When plates collide or one slides beneath another, the intense heat and pressure can melt rock, creating magma that erupts as volcanoes. When plates suddenly slip past each other, the ground shakes violently—that's an earthquake. Think of it like snapping a wooden stick: pressure builds up until suddenly it breaks, releasing all that energy at once.\n\nThe Ring of Fire, a horseshoe-shaped zone around the Pacific Ocean, is where most of Earth's earthquakes and volcanoes occur because it's where many plates meet. Japan, Indonesia, and the west coast of the Americas sit on this dangerous but geologically active zone.\n\nUnderstanding plate tectonics helps us predict where earthquakes might happen and why certain regions have volcanoes. It also explains why mountains exist where they do and why some areas are more geologically unstable than others. This knowledge helps us build safer buildings and prepare communities for natural disasters."])</script><script>self.__next_f.push([1,"12:T676,"])</script><script>self.__next_f.push([1,"Climate is like your personality—it's consistent over time. Weather is like your mood—it changes day to day. Understanding the difference is crucial for geography.\n\nEarth's climate zones are determined mainly by latitude (how far north or south you are from the equator) and how much sunlight each region receives. The equator gets direct, intense sunlight year-round, making it hot. The poles get slanted sunlight, making them cold. Between these extremes lie temperate zones where most of humanity lives.\n\nThere are five main climate zones: tropical (hot and wet), arid (dry), temperate (mild), continental (extreme seasons), and polar (freezing). Think of them as bands wrapping around Earth like a striped ball.\n\nWeather patterns are driven by the sun's heat, which creates wind and ocean currents. Warm air rises at the equator and sinks at the poles, creating predictable wind patterns. These winds push ocean currents, which distribute heat around the planet. The Gulf Stream, for example, carries warm water from the Caribbean to Europe, making places like Ireland much warmer than they should be for their latitude.\n\nMonsoons are seasonal wind patterns that bring heavy rainfall to regions like India and Southeast Asia. Hurricanes, tornadoes, and blizzards form when temperature and moisture conditions align perfectly—they're nature's way of redistributing heat energy.\n\nClimate zones determine what crops grow where, where people can comfortably live, and what natural disasters a region might face. This is why deserts exist at certain latitudes and rainforests at others. Geography literally shapes human civilisation through climate."])</script><script>self.__next_f.push([1,"13:T6b9,"])</script><script>self.__next_f.push([1,"Water is Earth's most precious resource, and it's constantly moving in a never-ending cycle. Imagine water as a traveller that visits the ocean, sky, land, and living things before returning to the ocean.\n\nThe water cycle has four main steps. First, evaporation: the sun heats water in oceans, lakes, and rivers, turning it into invisible water vapour that rises into the atmosphere. Second, condensation: as this vapour rises and cools, it turns back into liquid water droplets, forming clouds. Third, precipitation: when clouds become heavy with water, it falls as rain or snow. Fourth, collection: water flows downhill through rivers back to oceans, or soaks into the ground as groundwater.\n\nOceans cover 71% of Earth and contain 97% of our water, but it's salty and undrinkable. Only 3% is freshwater, and most of that is frozen in ice caps. This means less than 1% of Earth's water is available for drinking, farming, and industry—making freshwater incredibly valuable.\n\nRivers are Earth's highways for water and nutrients. The Nile, Amazon, and Yangtze rivers support billions of people by providing water for drinking, farming, and transport. Rivers shape the landscape, carving valleys and deltas where they meet the ocean.\n\nOceans do more than hold water—they regulate climate by absorbing heat, produce oxygen through algae, and provide food for billions. Ocean currents distribute heat around the planet, making some regions habitable and others frozen.\n\nUnderstanding the water cycle is essential because human activities like damming rivers, draining wetlands, and polluting groundwater disrupt this ancient system. Climate change is altering precipitation patterns, threatening water security worldwide."])</script><script>self.__next_f.push([1,"14:T747,"])</script><script>self.__next_f.push([1,"About 8 billion people live on Earth, but they're not spread evenly. Some regions are packed with people whilst others are nearly empty. Geography explains why.\n\nPeople cluster in areas with advantages: flat land for building, freshwater access, fertile soil for farming, and moderate climate. River valleys like the Nile, Ganges, and Yangtze have supported civilisations for thousands of years because they provide water and rich soil. Coastal areas attract people because oceans provide food and transport routes. Deserts, mountains, and frozen regions have sparse populations because survival is harder.\n\nToday, about 56% of humans live in cities, a dramatic shift from a century ago when most people farmed. Cities concentrate people near jobs, schools, and services. Megacities like Tokyo, Delhi, and Shanghai have over 20 million people. This urbanisation creates challenges: pollution, congestion, housing shortages, and strain on water and food supplies.\n\nPopulation growth varies dramatically by region. Africa's population is growing rapidly whilst Europe's is shrinking. This affects everything from job availability to environmental pressure. Countries with young, growing populations face different challenges than ageing societies.\n\nMigration—people moving from one place to another—reshapes populations. People migrate for better jobs, safety, education, or to escape conflict and poverty. Understanding migration patterns helps explain cultural diversity in cities and international tensions.\n\nGeography also influences population density through climate and resources. Bangladesh, with 170 million people in a small, flat delta, is incredibly dense. Australia, with similar land area but harsh climate and fewer resources, has only 26 million people. Geography doesn't determine destiny, but it certainly influences where and how people live."])</script><script>self.__next_f.push([1,"15:T7b0,"])</script><script>self.__next_f.push([1,"Imagine Earth as a pantry with limited supplies. Humans are consuming those supplies faster than nature can replenish them. Geography determines where resources exist and who has access to them.\n\nEnergy resources are unevenly distributed. Oil and natural gas concentrate in the Middle East, Russia, and parts of Africa. Coal exists worldwide but is dirty. Renewable energy like solar and wind depends on geography—sunny regions favour solar, windy coastlines favour wind turbines. This uneven distribution creates global power imbalances. Countries without oil must import it, making them dependent on others.\n\nFood production depends on climate and soil. The most fertile regions—river valleys, temperate zones with good rainfall—feed the world. But climate change is shifting rainfall patterns, threatening harvests. Desertification (when land becomes desert) is expanding in Africa and Asia, reducing farmable land. Meanwhile, global population keeps growing, demanding more food.\n\nFreshwater is increasingly scarce. Rivers like the Nile and Indus are over-allocated—more water is promised to users than actually flows. Aquifers (underground water reserves) are being drained faster than they refill. Some regions face water wars as countries compete for limited supplies. Climate change is making droughts longer and more severe in some areas whilst causing flooding in others.\n\nMineral resources like lithium, cobalt, and rare earths are concentrated in specific countries. Lithium, essential for batteries, is mostly in South America and Australia. This creates supply chain vulnerabilities—if one country controls a resource, others must negotiate.\n\nThe challenge is sustainability: using resources without depleting them. Renewable energy, efficient agriculture, and water conservation are essential. Geography isn't destiny, but it shapes resource availability and the challenges humanity faces in feeding, powering, and sustaining 8 billion people."])</script><script>self.__next_f.push([1,"16:T887,"])</script><script>self.__next_f.push([1,"Geopolitics is the study of how geography influences power, conflict, and international relations. It explains why certain countries are powerful and why conflicts erupt in specific places.\n\nGeographic advantages create power. Countries with large populations, vast resources, strategic location, and strong economies dominate. The United States has all four: 330 million people, abundant resources, coastlines on two oceans, and the world's largest economy. China has massive population and growing economic power. Russia controls vast energy resources and Arctic territory. These advantages translate to global influence.\n\nStrategic location matters enormously. The Strait of Malacca, between Malaysia and Indonesia, is so narrow that 30% of global maritime trade passes through it. Countries controlling such chokepoints have leverage over others. The Suez Canal, connecting Europe to Asia, is so valuable that wars have been fought over it. Small nations controlling strategic locations punch above their weight.\n\nResources drive conflict. Wars in the Middle East are partly about oil. Competition for rare earth minerals is intensifying between the US and China. Water scarcity is causing tensions between countries sharing rivers. As resources become scarcer, competition increases.\n\nBorders are geographic lines that often reflect historical power struggles rather than natural boundaries. Many African borders were drawn by European colonisers without considering ethnic groups or geography, creating ongoing conflicts. Maritime borders and claims to Arctic resources are becoming increasingly contested as climate change opens new shipping routes and resource access.\n\nGeography also influences alliances. Countries with shared interests, borders, or security concerns form blocs. NATO members are mostly in Europe and North America. The Shanghai Cooperation Organisation links Asian powers. These alliances reflect geographic proximity and shared interests.\n\nUnderstanding geopolitics helps explain why certain regions are conflict zones, why some countries are wealthy whilst others struggle, and how geography shapes international relations and global power distribution."])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-5 py-8\",\"children\":[[\"$\",\"nav\",null,{\"className\":\"mb-6\",\"children\":[\"$\",\"$L7\",null,{\"href\":\"/tracks\",\"className\":\"flex items-center gap-1 text-[13px] text-content-faint hover:text-content transition-colors\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":14,\"height\":14,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-arrow-left\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1l729n\",{\"d\":\"m12 19-7-7 7-7\"}],[\"$\",\"path\",\"x3x0zl\",{\"d\":\"M19 12H5\"}],\"$undefined\"]}],\"Learning Tracks\"]}]}],[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold text-content tracking-tight mb-2\",\"children\":\"World Geography\"}],[\"$\",\"p\",null,{\"className\":\"text-[14px] text-content-dim leading-relaxed mb-3\",\"children\":\"Discover how Earth's physical features, climate systems, and human populations shape our world. Learn why earthquakes happen, how oceans work, where people live, and how geography influences global power and resources.\"}],[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 text-[12px] text-content-faint\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":13,\"height\":13,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-book-open\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1akyts\",{\"d\":\"M12 7v14\"}],[\"$\",\"path\",\"ruj8y\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"}],\"$undefined\"]}],[\"$\",\"span\",null,{\"children\":[6,\" lessons\"]}],[\"$\",\"span\",null,{\"className\":\"text-content-faint\",\"children\":\"|\"}],[\"$\",\"span\",null,{\"children\":[\"~\",42,\" min total\"]}]]}]]}],[\"$\",\"$L10\",null,{\"lessons\":[{\"title\":\"How the Earth Works: Plate Tectonics, Volcanoes and Earthquakes\",\"content\":\"$11\",\"key_takeaways\":[\"Earth's crust is divided into tectonic plates that constantly move\",\"Volcanoes and earthquakes occur where plates meet and interact\",\"The Ring of Fire is the most geologically active region on Earth\",\"Understanding plate tectonics helps us predict and prepare for natural disasters\"],\"concepts\":[{\"term\":\"Tectonic Plates\",\"definition\":\"Massive pieces of Earth's crust that float on the mantle and move continuously\"},{\"term\":\"Subduction\",\"definition\":\"When one tectonic plate slides beneath another into the Earth's mantle\"},{\"term\":\"Magma\",\"definition\":\"Molten rock beneath Earth's surface that erupts as lava when it reaches the surface\"},{\"term\":\"Ring of Fire\",\"definition\":\"A horseshoe-shaped zone around the Pacific Ocean with intense volcanic and seismic activity\"}]},{\"title\":\"Climate Zones and Weather Patterns\",\"content\":\"$12\",\"key_takeaways\":[\"Climate is determined primarily by latitude and sunlight intensity\",\"Five main climate zones wrap around Earth in bands\",\"Weather patterns are driven by the sun's heat creating wind and ocean currents\",\"Climate zones determine agriculture, habitability, and natural disaster risk\"],\"concepts\":[{\"term\":\"Latitude\",\"definition\":\"Distance north or south from the equator, measured in degrees\"},{\"term\":\"Monsoon\",\"definition\":\"Seasonal wind pattern that brings predictable rainfall to tropical and subtropical regions\"},{\"term\":\"Ocean Current\",\"definition\":\"Large-scale movement of ocean water driven by wind and temperature differences\"},{\"term\":\"Tropical Climate\",\"definition\":\"Hot, wet climate near the equator with consistent warmth year-round\"}]},{\"title\":\"Oceans, Rivers and the Water Cycle\",\"content\":\"$13\",\"key_takeaways\":[\"The water cycle continuously moves water between oceans, atmosphere, and land\",\"Only 3% of Earth's water is freshwater, and less than 1% is readily available\",\"Oceans regulate climate and support most life on Earth\",\"Rivers provide water, nutrients, and transport for human civilisations\"],\"concepts\":[{\"term\":\"Evaporation\",\"definition\":\"Process where water from oceans and land surfaces turns into water vapour and rises into the atmosphere\"},{\"term\":\"Condensation\",\"definition\":\"Process where water vapour cools and turns back into liquid water droplets, forming clouds\"},{\"term\":\"Groundwater\",\"definition\":\"Water that soaks into soil and rock layers beneath the surface, often used for wells\"},{\"term\":\"Delta\",\"definition\":\"Flat area where a river deposits sediment as it meets the ocean, often triangular in shape\"}]},{\"title\":\"Population: Where People Live and Why\",\"content\":\"$14\",\"key_takeaways\":[\"People concentrate in areas with water, fertile soil, flat land, and moderate climate\",\"River valleys and coastal regions have historically supported the largest populations\",\"Over half of humanity now lives in cities, a recent historical shift\",\"Population growth and migration patterns vary dramatically by region and affect global challenges\"],\"concepts\":[{\"term\":\"Urbanisation\",\"definition\":\"Process of people moving from rural areas to cities, increasing urban population\"},{\"term\":\"Megacity\",\"definition\":\"City with a population exceeding 10 million people\"},{\"term\":\"Population Density\",\"definition\":\"Number of people per unit of land area, showing how crowded a region is\"},{\"term\":\"Migration\",\"definition\":\"Movement of people from one region or country to another for permanent or long-term settlement\"}]},{\"title\":\"Resources: Energy, Food and Water Challenges\",\"content\":\"$15\",\"key_takeaways\":[\"Energy resources like oil and gas are unevenly distributed, creating global power imbalances\",\"Fertile land and freshwater are increasingly scarce as population grows\",\"Climate change is threatening food and water security by altering rainfall patterns\",\"Mineral resources are concentrated in specific regions, creating supply chain dependencies\"],\"concepts\":[{\"term\":\"Desertification\",\"definition\":\"Process where fertile land gradually becomes desert, usually due to drought or overuse\"},{\"term\":\"Aquifer\",\"definition\":\"Underground layer of rock or soil that holds and supplies freshwater\"},{\"term\":\"Renewable Energy\",\"definition\":\"Energy from sources that naturally replenish, lik
