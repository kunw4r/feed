",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L8\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/feed/_next/static/chunks/75ec63104b458f64.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L9\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@a\"}]}]]}],{},null,false,false]},null,false,false]},null,false,false]},null,false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[24205,[\"/feed/_next/static/chunks/7c63d129e0aa498d.js\",\"/feed/_next/static/chunks/75ec63104b458f64.js\"],\"default\"]\n11:T67c,"])</script><script>self.__next_f.push([1,"Money is basically a tool we all agree has value. Instead of trading your chickens for someone's vegetables, you use money as the middleman. It's like a universal receipt that says \"I've done something valuable, and this proves it.\"\n\nBanks are like the security guards of money. When you deposit cash into a bank account, you're not actually keeping your money in a vault with your name on it. Instead, the bank takes your money and lends it to other people—like someone buying a house. In return, the bank pays you interest (a tiny percentage) for letting them use your cash.\n\nHere's the clever bit: banks make money by charging borrowers more interest than they pay you. If they pay you 2% interest on your savings but charge someone 6% on a home loan, they pocket the difference. It's a business, just like a café.\n\nWhen you swipe your debit card, you're telling the bank to move your money from your account to someone else's. Credit cards work differently—they're like a loan. You spend money you don't have yet, and the bank expects you to pay it back (usually with interest if you're slow).\n\nThe Reserve Bank of Australia (RBA) sits above all the other banks and controls the official interest rate. When they change this rate, it ripples through the entire economy—affecting how much mortgages cost, how much you earn on savings, and even how much your groceries might cost.\n\nThink of the banking system like a giant plumbing network. Money flows through pipes (banks), and the RBA controls the main valve. When they turn it up, money flows faster and cheaper. When they turn it down, money becomes harder to access and more expensive to borrow."])</script><script>self.__next_f.push([1,"12:T6a9,"])</script><script>self.__next_f.push([1,"Imagine you and your mates want to start a pizza shop. It costs $100,000 to set up, but none of you have that much cash individually. So you decide to split ownership into 1,000 equal pieces (shares) worth $100 each. You sell 600 shares to investors and keep 400 for yourselves. Now you've got your $60,000 to start the business, and those investors own a piece of your pizza shop.\n\nThat's essentially what stocks are. When a company goes public, it sells shares (also called equity) to regular people like you. Own a share? You own a tiny slice of that company. If the pizza shop makes huge profits, your share becomes more valuable. If it goes bust, your share becomes worthless.\n\nThe share market (or stock exchange) is where people buy and sell these shares. In Australia, it's the ASX (Australian Securities Exchange). Prices go up and down based on what people think the company is worth. If everyone suddenly loves your pizza shop and thinks it'll be hugely profitable, they'll pay more for shares. If there's a scandal, prices crash.\n\nHere's the key: when you buy a share, you're betting on the company's future. You're saying, \"I think this company will do well, so I'm willing to pay this price.\" When you sell, you're betting the opposite—that it won't do as well, or that someone else will pay more than you did.\n\nDividends are bonuses. Some companies share their profits with shareholders. If you own 10 shares and the company pays a $1 dividend per share, you get $10 in your pocket.\n\nThe share market can be scary because prices bounce around wildly. But historically, patient investors who buy and hold good companies for years tend to do well. It's not gambling if you do your homework."])</script><script>self.__next_f.push([1,"13:T722,"])</script><script>self.__next_f.push([1,"Interest rates are the price of money. When the RBA raises rates, borrowing becomes more expensive. When they lower rates, borrowing becomes cheaper. This sounds simple, but it affects almost every financial decision you'll make.\n\nLet's say you want to buy a house for $500,000. With a 3% interest rate, your monthly mortgage payment might be $2,100. With a 7% interest rate, it jumps to $3,300. That's $1,200 extra every month! Higher rates make borrowing painful, so fewer people buy houses. Fewer house sales mean house prices often fall.\n\nBut here's the twist: when rates are high, your savings account earns more interest. A high-interest savings account might pay 4% when rates are high, versus 0.5% when they're low. So savers benefit from high rates, while borrowers suffer.\n\nCompanies feel it too. If a company wants to expand and needs to borrow $10 million, high interest rates make that expansion plan look bad. They might cancel it, which means fewer jobs and slower economic growth. This is why central banks use interest rates as a tool to control inflation (when prices rise too fast) and unemployment.\n\nWhen inflation is high (your coffee costs $6 instead of $5), the RBA raises rates to cool things down. Higher rates make borrowing expensive, so people spend less, demand drops, and prices stabilise. It's like turning down the heat on a boiling pot.\n\nThe tricky part? There's a lag. It takes months for rate changes to work through the economy. By the time the RBA realises they've raised rates too much, damage might already be done. This is why economists debate interest rate decisions constantly.\n\nAs a young person, you should care about rates because they affect your first home purchase, your student loans, and how much your savings earn. Understanding rates helps you time big financial decisions."])</script><script>self.__next_f.push([1,"14:T715,"])</script><script>self.__next_f.push([1,"Before you invest in a company's shares, you need to know if it's actually healthy. Imagine your mate tells you his pizza shop is thriving, but you discover he's spending $10,000 a month on rent and only making $8,000 in sales. That's not thriving—that's heading for bankruptcy. Companies publish financial statements so you can check their health.\n\nThe main document is the income statement (or profit and loss statement). It shows how much money came in (revenue), how much went out (expenses), and what's left over (profit). If revenue is growing and profit is growing, that's usually good. If revenue is growing but profit is shrinking, something's wrong—maybe expenses are out of control.\n\nNext is the balance sheet. Think of it like a snapshot of what the company owns (assets) versus what it owes (liabilities). If a company owns $100 million in assets but owes $90 million, it has $10 million in equity (net worth). If it owes more than it owns, it's technically insolvent.\n\nThe cash flow statement is crucial. A company can look profitable on paper but have no actual cash. Imagine a pizza shop that sells $100,000 worth of pizzas on credit but hasn't collected the money yet. On the income statement, it looks great. But if it can't pay its staff this week, it's in trouble. Cash flow shows the actual money moving in and out.\n\nKey ratios to watch: the debt-to-equity ratio (how much it owes versus what it's worth), the current ratio (can it pay short-term debts?), and profit margin (what percentage of sales becomes profit?). A company with low debt, good cash flow, and growing profits is usually a safer bet.\n\nDon't just look at one year. Compare three to five years of statements. Is the company consistently improving, or is it all over the place? Consistency matters more than one good year."])</script><script>self.__next_f.push([1,"15:T78f,"])</script><script>self.__next_f.push([1,"Cryptocurrency is digital money that exists only on computers. There's no physical coin or note. Bitcoin, Ethereum, and thousands of others are all cryptocurrencies. But how does digital money work without a bank controlling it?\n\nTraditional money relies on trust in institutions. You trust your bank won't steal your money. You trust the government won't print infinite cash and destroy the value of your savings. Cryptocurrency tries to remove that trust requirement by using mathematics and a network of computers instead.\n\nHere's the clever bit: cryptocurrencies use blockchain technology. Imagine a notebook that records every transaction. When you send Bitcoin to your mate, that transaction gets written in the notebook. But here's the twist—thousands of computers have copies of this notebook, and they all have to agree the transaction is valid before it's recorded. If someone tries to cheat and change their copy, the other thousands of copies will reject it. It's like having thousands of witnesses to every transaction.\n\nBitcoin was created in 2009 by someone (or someones) using the fake name Satoshi Nakamoto. There will only ever be 21 million bitcoins. This scarcity is intentional—it's supposed to make Bitcoin valuable, like gold. You can't just print more whenever you want.\n\nBut here's the problem: crypto is volatile. Bitcoin's price swings wildly—from $20,000 to $60,000 in months. That makes it terrible as money (you can't plan if the price keeps changing) but interesting as an investment (or gamble, depending on your view).\n\nMost cryptocurrencies are unregulated, meaning if you get scammed or your exchange goes bust, there's no government safety net. Unlike your bank account (protected up to $250,000 by the government), crypto is the Wild West.\n\nCrypto isn't inherently bad or good. It's a technology with potential uses. But for beginners, it's risky. Don't invest money you can't afford to lose."])</script><script>self.__next_f.push([1,"16:T839,"])</script><script>self.__next_f.push([1,"The best time to invest was 20 years ago. The second-best time is today. As a young person, you have the most powerful investing tool available: time. Money invested at age 25 has 40 years to grow before retirement. Money invested at 45 has only 20 years. That difference is enormous thanks to compound interest.\n\nCompound interest is when your money earns returns, and those returns earn their own returns. It's like planting a tree. The tree grows, produces seeds, those seeds grow into more trees, and suddenly you have a forest. Albert Einstein allegedly called it the eighth wonder of the world.\n\nHere's a practical example: invest $5,000 at age 25 in a diversified share portfolio earning 8% annually. By age 65, that $5,000 becomes roughly $160,000. You only put in $5,000, but compound interest did the heavy lifting. Start at 45 instead, and that same $5,000 becomes only $46,000. Time is your superpower.\n\nSo where do you start? First, build an emergency fund (3-6 months of expenses) in a high-interest savings account. This stops you from panic-selling investments when life goes wrong. Next, open a brokerage account (an app that lets you buy shares). Popular Australian options include Superhero, Stake, or Commsec.\n\nFor beginners, index funds are safer than picking individual stocks. An index fund is like buying a tiny piece of 200-500 companies at once. If one company tanks, it barely affects you. The ASX200 index fund tracks Australia's 200 biggest companies. International index funds track companies worldwide. Diversification reduces risk.\n\nStart small. You don't need $10,000. Many platforms let you invest $100 or even $50. The goal is to build the habit. Invest regularly (monthly is good) rather than trying to time the market perfectly. Most people who try to time the market fail.\n\nFinally, avoid these mistakes: don't panic-sell when markets crash (they always recover eventually), don't invest money you'll need within 5 years, and don't chase hot tips from mates. Boring, diversified, long-term investing beats exciting, concentrated, short-term trading almost every time."])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-5 py-8\",\"children\":[[\"$\",\"nav\",null,{\"className\":\"mb-6\",\"children\":[\"$\",\"$L7\",null,{\"href\":\"/tracks\",\"className\":\"flex items-center gap-1 text-[13px] text-content-faint hover:text-content transition-colors\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":14,\"height\":14,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-arrow-left\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1l729n\",{\"d\":\"m12 19-7-7 7-7\"}],[\"$\",\"path\",\"x3x0zl\",{\"d\":\"M19 12H5\"}],\"$undefined\"]}],\"Learning Tracks\"]}]}],[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold text-content tracking-tight mb-2\",\"children\":\"Finance Fundamentals\"}],[\"$\",\"p\",null,{\"className\":\"text-[14px] text-content-dim leading-relaxed mb-3\",\"children\":\"A beginner-friendly introduction to personal finance, investing, and how money works in the modern economy. Learn the basics of banking, shares, interest rates, and cryptocurrency in bite-sized lessons.\"}],[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 text-[12px] text-content-faint\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":13,\"height\":13,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-book-open\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1akyts\",{\"d\":\"M12 7v14\"}],[\"$\",\"path\",\"ruj8y\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"}],\"$undefined\"]}],[\"$\",\"span\",null,{\"children\":[6,\" lessons\"]}],[\"$\",\"span\",null,{\"className\":\"text-content-faint\",\"children\":\"|\"}],[\"$\",\"span\",null,{\"children\":[\"~\",42,\" min total\"]}]]}]]}],[\"$\",\"$L10\",null,{\"lessons\":[{\"title\":\"What is Money and How Banking Works\",\"content\":\"$11\",\"key_takeaways\":[\"Money is a shared agreement that something has value\",\"Banks profit by borrowing your money cheaply and lending it expensively\",\"Interest rates are the price of borrowing money\",\"The RBA controls Australia's official interest rate, affecting the whole economy\"],\"concepts\":[{\"term\":\"Interest\",\"definition\":\"The cost of borrowing money, or the reward for lending it. Usually expressed as a percentage per year.\"},{\"term\":\"Debit Card\",\"definition\":\"A card that lets you spend money directly from your bank account. You can only spend what you have.\"},{\"term\":\"Credit Card\",\"definition\":\"A card that lets you borrow money from a bank to spend now, with the obligation to pay it back later (usually with interest).\"},{\"term\":\"Reserve Bank of Australia (RBA)\",\"definition\":\"Australia's central bank that controls the official interest rate and manages the country's money supply.\"}]},{\"title\":\"Stocks and the Share Market Explained\",\"content\":\"$12\",\"key_takeaways\":[\"A share is a tiny piece of ownership in a company\",\"Share prices rise when people think the company will do well, and fall when they don't\",\"Dividends are profits that companies sometimes share with shareholders\",\"The ASX is where Australians buy and sell shares\"],\"concepts\":[{\"term\":\"Share (or Stock)\",\"definition\":\"A unit of ownership in a company. If a company has 1,000 shares and you own 10, you own 1% of the company.\"},{\"term\":\"ASX\",\"definition\":\"The Australian Securities Exchange—the main stock market where Australians buy and sell shares.\"},{\"term\":\"Dividend\",\"definition\":\"A payment made by a company to its shareholders, usually from profits. Not all companies pay dividends.\"},{\"term\":\"Market Capitalisation\",\"definition\":\"The total value of a company, calculated by multiplying the share price by the number of shares outstanding.\"}]},{\"title\":\"How Interest Rates Affect Everything\",\"content\":\"$13\",\"key_takeaways\":[\"Interest rates are the price of borrowing money\",\"Higher rates make borrowing expensive and saving rewarding\",\"Lower rates make borrowing cheap and saving unrewarding\",\"The RBA uses rates to control inflation and unemployment\"],\"concepts\":[{\"term\":\"Interest Rate\",\"definition\":\"The percentage charged for borrowing money, or paid for lending it. Usually expressed as a percentage per year.\"},{\"term\":\"Inflation\",\"definition\":\"When prices for goods and services rise over time, reducing the purchasing power of money.\"},{\"term\":\"Monetary Policy\",\"definition\":\"The RBA's tools for controlling the money supply and interest rates to manage the economy.\"},{\"term\":\"Real Interest Rate\",\"definition\":\"The interest rate adjusted for inflation. If rates are 5% but inflation is 3%, the real rate is about 2%.\"}]},{\"title\":\"Reading a Company's Financial Health\",\"content\":\"$14\",\"key_takeaways\":[\"The income statement shows revenue, expenses, and profit\",\"The balance sheet shows assets, liabilities, and equity\",\"The cash flow statement shows actual money moving in and out\",\"Compare multiple years to spot trends, not just one year's results\"],\"concepts\":[{\"term\":\"Revenue\",\"definition\":\"The total money a company makes from selling products or services, before expenses.\"},{\"term\":\"Profit\",\"definition\":\"What's left after subtracting all expenses from revenue. Also called net income or earnings.\"},{\"term\":\"Assets\",\"definition\":\"Everything a company owns that has value—cash, equipment, property, investments, etc.\"},{\"term\":\"Liabilities\",\"definition\":\"Everything a company owes—loans, unpaid bills, wages owed to employees, etc.\"},{\"term\":\"Equity\",\"definition\":\"What's left after subtracting liabilities from assets. It's the company's net worth.\"}]},{\"title\":\"What Crypto Actually Is\",\"content\":\"$15\",\"key_takeaways\":[\"Cryptocurrency is digital money secured by mathematics and networks, not banks\",\"Blockchain is a shared ledger that records all transactions across thousands of computers\",\"Bitcoin is scarce by design (only 21 million will ever exist)\",\"Crypto is volatile, unregulated, and risky for beginners\"],\"concepts\":[{\"term\":\"Cryptocurrency\",\"definition\":\"Digital money that uses cryptography (mathematical codes) to secure transactions and control the creation of new units.\"},{\"term\":\"Blockchain\",\"definition\":\"A distributed ledger (record book) where transactions are recorded in blocks, linked together chronologically, and verified by a network of computers.\"},{\"term\":\"Bitcoin\",\"definition\":\"The first and most famous cryptocurrency, created in 2009. Limited to 21 million coins total.\"},{\"term\":\"Wallet\",\"definition\":\"Digital software that stores your cryptocurrency and allows you to send and receive it. Like a digital purse.\"},{\"term\":\"Exchange\",\"definition\":\"A platform where you buy and sell cryptocurrency using regular money. Examples: Coinbase, Kraken.\"}]},{\"title\":\"How to Start Investing as a Young Person\",\"content\":\"$16\",\"key_takeaways\":[\"Time is your biggest advantage as a young investor\",\"Compound interest turns small investments into large sums over decades\",\"Start with an emergency fund before investing\",\"Index funds are safer than picking individual stocks for beginners\",\"Invest regularly and avoid panic-selling during market downturns\"],\"concepts\":[{\"term\":\"Compound Interest\",\"definition\":\"Interest earned on interest. Your money grows exponentially because returns earn their own returns.\"},{\"term\":\"Index Fund\",\"definition\":\"A fund that tracks a market index (like the ASX200) by holding tiny pieces of many companies. Low cost and diversified.\"},{\"term\":\"Diversification\",\"definition\":\"Spreading your money across many different investments to reduce risk. Don't put all eggs in one basket.\"},{\"term\":\"Brokerage Account\",\"definition\":\"An account with a financial company that lets you buy and sell shares, ETFs, and other investments.\"},{\"term\":\"ETF\",\"definition\":\"Exchange-Traded Fund. Similar to an index fund but trades like a stock. Holds many companies in one investment.\"}]}]}]]}]\n"])</script><script>self.__next_f.push([1,"c:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"c
