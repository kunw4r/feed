,\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[null,[\"$\",\"$L5\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L6\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":\"$undefined\",\"forbidden\":\"$undefined\",\"unauthorized\":\"$undefined\"}]]}],{\"children\":[[\"$\",\"$1\",\"c\",{\"children\":[\"$L8\",[[\"$\",\"script\",\"script-0\",{\"src\":\"/feed/_next/static/chunks/75ec63104b458f64.js\",\"async\":true,\"nonce\":\"$undefined\"}]],[\"$\",\"$L9\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.MetadataOutlet\",\"children\":\"$@a\"}]}]]}],{},null,false,false]},null,false,false]},null,false,false]},null,false,false],[\"$\",\"$1\",\"h\",{\"children\":[null,[\"$\",\"$Lb\",null,{\"children\":\"$Lc\"}],[\"$\",\"div\",null,{\"hidden\":true,\"children\":[\"$\",\"$Ld\",null,{\"children\":[\"$\",\"$3\",null,{\"name\":\"Next.Metadata\",\"children\":\"$Le\"}]}]}],null]}],false]],\"m\":\"$undefined\",\"G\":[\"$f\",[]],\"S\":true}\n"])</script><script>self.__next_f.push([1,"10:I[24205,[\"/feed/_next/static/chunks/7c63d129e0aa498d.js\",\"/feed/_next/static/chunks/75ec63104b458f64.js\"],\"default\"]\n11:T60c,"])</script><script>self.__next_f.push([1,"Think of your muscles like a building under construction. When you exercise, you're essentially creating tiny tears in your muscle fibres. Your body then repairs these tears, making the muscle slightly bigger and stronger than before. This process is called muscle protein synthesis, and it's the foundation of all fitness progress.\n\nWhy does exercise matter beyond just building muscle? When you move your body regularly, you're strengthening your heart, improving blood flow, boosting your mood through endorphins, and increasing your overall energy levels. Exercise is like maintenance for your entire body—it keeps everything running smoothly.\n\nHere's the key: muscles don't grow during the workout itself. They grow during rest, when your body repairs the damage. This is why consistency matters more than intensity. Doing moderate exercise three times a week will build more muscle than doing one intense session and then resting for a month.\n\nYour body also adapts to stress. If you always do the same workout, your muscles adapt and stop growing. This is why varying your exercises and gradually increasing difficulty—called progressive overload—is crucial for continued improvement.\n\nAnother important point: everyone's body is different. Genetics play a role in how quickly you build muscle and how your body responds to training. But don't let that discourage you—consistency beats genetics almost every time. Someone with average genetics who trains consistently will outperform someone naturally gifted who trains sporadically."])</script><script>self.__next_f.push([1,"12:T615,"])</script><script>self.__next_f.push([1,"Imagine two types of fitness tools: cardio is like sharpening your engine's efficiency, while strength training is like upgrading your engine's power. Both are valuable, but they do different things.\n\nCardio—running, cycling, swimming, dancing—gets your heart pumping and your lungs working harder. It's excellent for cardiovascular health, burning calories, and building endurance. When you do cardio, you're training your heart to pump blood more efficiently and your body to use oxygen better. Think of it as improving your body's fuel efficiency.\n\nStrength training—weights, resistance bands, bodyweight exercises—builds muscle and bone density. It increases your metabolic rate, meaning you burn more calories even at rest. Strength training also improves functional fitness, making everyday tasks like carrying groceries or playing with kids easier.\n\nHere's the important bit: they're not competitors; they're teammates. Ideally, you should do both. A balanced fitness routine includes cardiovascular work for heart health and strength training for muscle and bone health.\n\nThe differences matter for your goals though. Want to run a marathon? Prioritise cardio. Want to build muscle? Prioritise strength training. Want overall health? Mix them equally.\n\nOne common misconception: cardio won't make you bulky, and strength training won't make you slow. Modern fitness science shows that combining both creates the best results. Athletes in almost every sport now incorporate both types of training because they complement each other perfectly."])</script><script>self.__next_f.push([1,"13:T651,"])</script><script>self.__next_f.push([1,"Building a workout routine is like constructing a house: you need a solid foundation before adding fancy features. Let's start simple.\n\nFirst, decide your frequency. If you're completely new to exercise, start with three days per week. This gives your body enough stimulus to adapt while allowing recovery time. Each session should be 30-45 minutes. As you progress, you can increase to four or five days.\n\nSecond, choose your activities. Pick exercises you actually enjoy—consistency is impossible if you hate what you're doing. If you dislike running, don't force yourself to run. Try cycling, swimming, or dancing instead. For strength training, start with compound movements: squats, push-ups, rows, and deadlifts. These work multiple muscle groups simultaneously and are incredibly efficient.\n\nThird, structure your sessions. A basic session looks like: 5-10 minute warm-up, 20-30 minutes of main workout, 5-10 minute cool-down. The warm-up prepares your body; the main workout is where the work happens; the cool-down helps your heart rate return to normal.\n\nFourth, start light. This is crucial. Using too much weight or doing too many repetitions too quickly leads to injury and burnout. Start with weights you can lift comfortably for 8-12 repetitions. If you can't complete the set with good form, it's too heavy.\n\nFinally, plan rest days. Rest days aren't lazy—they're when your body actually adapts and gets stronger. Aim for at least one full rest day per week, and never train the same muscle groups on consecutive days.\n\nRemember: a simple routine you actually do beats a perfect routine you don't."])</script><script>self.__next_f.push([1,"14:T664,"])</script><script>self.__next_f.push([1,"You can't out-exercise a bad diet. Think of nutrition like fuel for your car: the right fuel makes it run smoothly; the wrong fuel damages the engine. Your body works the same way.\n\nThere are three main macronutrients: protein, carbohydrates, and fats. Protein is essential for muscle repair and growth—aim for about 0.8-1 gram per pound of bodyweight daily. Good sources include chicken, fish, eggs, beans, and Greek yoghurt. Carbohydrates provide energy for your workouts—choose whole grains, oats, sweet potatoes, and fruits. Fats support hormone production and nutrient absorption—include avocados, nuts, olive oil, and fatty fish.\n\nHydration is often overlooked but critically important. Your muscles are 75% water. Dehydration reduces performance and recovery. Drink water throughout the day, not just during workouts. A simple rule: drink enough that your urine is pale yellow.\n\nTiming matters somewhat. Eating a small meal or snack 1-2 hours before exercise provides energy. Eating protein and carbs within 30-60 minutes after exercise helps with recovery. However, don't stress too much about this—overall daily nutrition matters far more than perfect timing.\n\nCalories still matter. If you want to lose weight, you need to eat fewer calories than you burn. If you want to gain muscle, you need to eat slightly more. But focus on whole foods first. A diet of whole foods naturally regulates calories better than processed foods.\n\nFinally, consistency beats perfection. Eating well 80% of the time and having flexibility 20% of the time is sustainable and effective. Restrictive diets fail because they're unsustainable."])</script><script>self.__next_f.push([1,"15:T6c3,"])</script><script>self.__next_f.push([1,"Recovery is where the magic happens. Many beginners make the mistake of thinking more training equals faster results. Actually, overtraining without adequate recovery leads to injury, burnout, and plateaus. Recovery is when your body adapts to the stress you've placed on it.\n\nSleep is your most powerful recovery tool. During sleep, your body releases growth hormone, repairs muscle tissue, and consolidates memories of movement patterns. Aim for 7-9 hours nightly. Poor sleep sabotages even the best training programme. If you're not sleeping well, your fitness progress will suffer regardless of how hard you train.\n\nActive recovery is valuable too. On rest days, light activities like walking, yoga, or stretching increase blood flow without stressing your muscles. This promotes healing without adding fatigue.\n\nNutrition supports recovery. Protein repairs muscle; carbs replenish energy stores; fats support hormone production. Staying hydrated helps flush metabolic waste products.\n\nNow, about injury prevention: most injuries come from doing too much too soon or using poor form. Here's how to avoid them: warm up properly before every session, use appropriate weight, maintain good form even when fatigued, and progress gradually. If something hurts (not muscle soreness, but sharp pain), stop immediately.\n\nMuscle soreness is normal—that's delayed-onset muscle soreness (DOMS) from new exercise. It typically peaks 24-48 hours after training and subsides within a week. This is different from injury pain, which is sharp and localised.\n\nListen to your body. Fatigue, persistent soreness, or declining performance might signal overtraining. Take an extra rest day. Your fitness won't disappear; your body will thank you."])</script><script>self.__next_f.push([1,"16:T692,"])</script><script>self.__next_f.push([1,"Goals give your training direction. Without them, you're like a ship without a destination—you might move, but you won't know if you're going the right way. Effective goals are specific, measurable, achievable, relevant, and time-bound (SMART).\n\nInstead of 'get fit,' try 'do 10 push-ups without stopping in 8 weeks' or 'run 5 kilometres in under 30 minutes in 12 weeks.' Specific goals give you something concrete to work towards.\n\nTrack your progress. This is incredibly motivating and helps you identify what's working. For strength training, write down the weight and repetitions you lift each session. For cardio, note distance and time. For body composition, take progress photos every 4 weeks (scale weight fluctuates daily and isn't reliable).\n\nProgress isn't always linear. Some weeks you'll feel stronger; others you'll plateau or even feel weaker. This is normal. Plateaus happen when your body adapts to your current training. When you plateau, change something: increase weight, add more repetitions, try new exercises, or adjust your routine structure.\n\nCelebrate small wins. Hitting a personal record, completing an extra repetition, or running slightly faster are all victories worth acknowledging. These small wins build momentum and motivation.\n\nReassess every 4-6 weeks. Are you progressing towards your goal? If yes, keep going. If no, adjust your approach. Maybe you need more recovery, better nutrition, or a different training style. Fitness is individual—what works for someone else might not work for you.\n\nRemember: the best goal is one you'll actually work towards. Choose something that genuinely excites you, not something you think you should want."])</script><script>self.__next_f.push([1,"8:[\"$\",\"div\",null,{\"className\":\"max-w-3xl mx-auto px-5 py-8\",\"children\":[[\"$\",\"nav\",null,{\"className\":\"mb-6\",\"children\":[\"$\",\"$L7\",null,{\"href\":\"/tracks\",\"className\":\"flex items-center gap-1 text-[13px] text-content-faint hover:text-content transition-colors\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":14,\"height\":14,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-arrow-left\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1l729n\",{\"d\":\"m12 19-7-7 7-7\"}],[\"$\",\"path\",\"x3x0zl\",{\"d\":\"M19 12H5\"}],\"$undefined\"]}],\"Learning Tracks\"]}]}],[\"$\",\"div\",null,{\"className\":\"mb-8\",\"children\":[[\"$\",\"h1\",null,{\"className\":\"text-2xl font-bold text-content tracking-tight mb-2\",\"children\":\"Fitness \u0026 Training\"}],[\"$\",\"p\",null,{\"className\":\"text-[14px] text-content-dim leading-relaxed mb-3\",\"children\":\"A beginner-friendly guide to understanding how your body responds to exercise, building effective workout routines, and achieving your fitness goals through science-backed principles.\"}],[\"$\",\"div\",null,{\"className\":\"flex items-center gap-2 text-[12px] text-content-faint\",\"children\":[[\"$\",\"svg\",null,{\"ref\":\"$undefined\",\"xmlns\":\"http://www.w3.org/2000/svg\",\"width\":13,\"height\":13,\"viewBox\":\"0 0 24 24\",\"fill\":\"none\",\"stroke\":\"currentColor\",\"strokeWidth\":2,\"strokeLinecap\":\"round\",\"strokeLinejoin\":\"round\",\"className\":\"lucide lucide-book-open\",\"aria-hidden\":\"true\",\"children\":[[\"$\",\"path\",\"1akyts\",{\"d\":\"M12 7v14\"}],[\"$\",\"path\",\"ruj8y\",{\"d\":\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"}],\"$undefined\"]}],[\"$\",\"span\",null,{\"children\":[6,\" lessons\"]}],[\"$\",\"span\",null,{\"className\":\"text-content-faint\",\"children\":\"|\"}],[\"$\",\"span\",null,{\"children\":[\"~\",42,\" min total\"]}]]}]]}],[\"$\",\"$L10\",null,{\"lessons\":[{\"title\":\"How Muscles Grow and Why Exercise Matters\",\"content\":\"$11\",\"key_takeaways\":[\"Muscles grow during rest, not during exercise itself\",\"Exercise strengthens your entire body, not just muscles\",\"Consistency matters more than intensity for long-term progress\",\"Progressive overload keeps your body adapting and improving\"],\"concepts\":[{\"term\":\"Muscle Protein Synthesis\",\"definition\":\"The process where your body repairs and builds muscle tissue after exercise-induced damage\"},{\"term\":\"Progressive Overload\",\"definition\":\"Gradually increasing the difficulty, weight, or volume of your workouts to continue making progress\"},{\"term\":\"Endorphins\",\"definition\":\"Chemicals released during exercise that improve mood and reduce pain perception\"}]},{\"title\":\"Cardio vs Strength Training Explained\",\"content\":\"$12\",\"key_takeaways\":[\"Cardio improves heart health and endurance; strength training builds muscle and bone\",\"Both types of training are important for overall fitness\",\"Cardio and strength training complement each other, not compete\",\"Your goals should guide which type you prioritise, but ideally do both\"],\"concepts\":[{\"term\":\"Cardiovascular Training\",\"definition\":\"Exercise that elevates heart rate and improves the efficiency of your heart and lungs\"},{\"term\":\"Strength Training\",\"definition\":\"Exercise using resistance to build muscle, increase strength, and improve bone density\"},{\"term\":\"Metabolic Rate\",\"definition\":\"The number of calories your body burns at rest; higher muscle mass increases this rate\"}]},{\"title\":\"Building a Workout Routine from Scratch\",\"content\":\"$13\",\"key_takeaways\":[\"Start with three workouts per week for 30-45 minutes each\",\"Choose exercises you enjoy to ensure consistency\",\"Compound movements are most efficient for beginners\",\"Start light and prioritise good form over heavy weight\",\"Rest days are essential for adaptation and injury prevention\"],\"concepts\":[{\"term\":\"Compound Movements\",\"definition\":\"Exercises that work multiple muscle groups simultaneously, like squats and deadlifts\"},{\"term\":\"Rep Range\",\"definition\":\"The number of repetitions you perform; 8-12 reps is ideal for muscle building\"},{\"term\":\"Form\",\"definition\":\"The correct technique for performing an exercise safely and effectively\"}]},{\"title\":\"Nutrition Basics for Fitness\",\"content\":\"$14\",\"key_takeaways\":[\"Protein is essential for muscle repair; aim for 0.8-1g per pound of bodyweight\",\"Carbs provide energy; fats support hormones and nutrient absorption\",\"Hydration is critical for performance and recovery\",\"Overall daily nutrition matters more than meal timing\",\"Consistency and whole foods beat restrictive dieting\"],\"concepts\":[{\"term\":\"Macronutrients\",\"definition\":\"The three main nutrients your body needs: protein, carbohydrates, and fats\"},{\"term\":\"Caloric Deficit\",\"definition\":\"Eating fewer calories than you burn, necessary for weight loss\"},{\"term\":\"Whole Foods\",\"definition\":\"Unprocessed foods like vegetables, fruits, grains, and proteins without added chemicals\"}]},{\"title\":\"Recovery, Rest, and Avoiding Injury\",\"content\":\"$15\",\"key_takeaways\":[\"Recovery is when adaptation happens; it's as important as training\",\"Sleep is your most powerful recovery tool; aim for 7-9 hours nightly\",\"Active recovery on rest days promotes healing without fatigue\",\"Proper warm-up, appropriate weight, and good form prevent injury\",\"Muscle soreness is normal; sharp pain signals potential injury\"],\"concepts\":[{\"term\":\"DOMS (Delayed-Onset Muscle Soreness)\",\"definition\":\"Normal muscle soreness that peaks 24-48 hours after new or intense exercise\"},{\"term\":\"Active
